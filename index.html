<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A Good Morning Tree Service — Field Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green-dark:#1a2e1a;--green-mid:#2d5a27;--green-accent:#4a8c3f;
  --green-pale:#c8e6c4;--green-ghost:#f0f7ef;
  --amber:#c8860a;--amber-light:#fdf3dc;--red:#b83232;
  --blue:#2563a8;
  --cream:#faf8f4;--paper:#f4f1eb;--ink:#1a1a18;--ink-mid:#3d3d38;
  --ink-soft:#6b6b64;--ink-ghost:#a8a89e;--border:#d8d4c8;--border-soft:#ece9e0;
  --white:#ffffff;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
html{font-size:15px}
body{font-family:var(--font-body);background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
input,select,textarea{font-family:var(--font-body);font-size:.88rem;color:var(--ink);background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px;width:100%;transition:border-color .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green-accent);box-shadow:0 0 0 3px rgba(74,140,63,.12)}
textarea{resize:vertical;line-height:1.6}
select{cursor:pointer}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=range]{-webkit-appearance:none;background:transparent;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--green-accent);border-radius:50%;margin-top:-6px}
label{display:block;font-size:.72rem;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;transition:all .15s}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useCallback,useRef} = React;

// DATA
const STORAGE_KEY='agmts_jobs_v1';
const SETTINGS_KEY='agmts_settings_v1';
const DEFAULT_SETTINGS={companyName:'A Good Morning Tree Service',phone:'(512) 555-0100',email:'office@agmts.com',isaNumber:'TX-XXXX',tdaNumber:'XXXXXXX',rateRemoval:65,ratePruning:28,rateTreatment:180,rateStump:12,rateDebrisHaul:150,multConfined:1.35,multCrane:1.6,taxRate:0.04};
const WORK_TYPES=[{id:'removal',label:'Removal',badge:'removal'},{id:'pruning',label:'Crown Prune',badge:'pruning'},{id:'deadwood',label:'Deadwood',badge:'pruning'},{id:'clearance',label:'Utility Clearance',badge:'pruning'},{id:'stump',label:'Stump Grind',badge:'stump'},{id:'debris',label:'Debris Haul',badge:'stump'},{id:'crane',label:'Crane Required',badge:'removal'},{id:'treatment',label:'Trunk Injection',badge:'treatment'},{id:'spray',label:'Crown Spray',badge:'treatment'},{id:'drench',label:'Soil Drench',badge:'treatment'},{id:'cabling',label:'Cabling/Bracing',badge:'cabling'},{id:'assessment',label:'Risk Assessment',badge:'cabling'}];
const BADGE_COLORS={removal:{bg:'#fdeaea',color:'#7a1f1f'},pruning:{bg:'#e8f0fc',color:'#1a3f7a'},treatment:{bg:'#fdf3dc',color:'#7a4a0a'},stump:{bg:'#f0f7ef',color:'#1a4a18'},cabling:{bg:'#ede8fc',color:'#3a1f7a'}};
const PIN_COLORS={removal:'#b83232',pruning:'#2563a8',treatment:'#c8860a',stump:'#2d5a27',cabling:'#5b3fa8'};
let _uid=0;
function uid(){return`id_${Date.now()}_${++_uid}`}
function createTree(n){return{id:uid(),tag:`T${n}`,species:'',commonName:'',dbh:'',height:'',condition:'fair',workTypes:[],notes:'',accessNotes:'',photos:[],mapX:.25+Math.random()*.5,mapY:.2+Math.random()*.5,difficulty:'standard'}}
function createJob(){const now=new Date();return{id:uid(),jobNumber:`${now.getFullYear()}-${String(now.getTime()).slice(-4)}`,status:'draft',createdAt:now.toISOString(),updatedAt:now.toISOString(),clientName:'',clientPhone:'',clientEmail:'',address:'',city:'',state:'TX',zip:'',siteAccess:'open',siteNotes:'',trees:[createTree(1)],pricingOverrides:{},notes:''}}
function loadJobs(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):[]}catch{return[]}}
function saveJobs(j){localStorage.setItem(STORAGE_KEY,JSON.stringify(j));try{const bc=new BroadcastChannel('agmts');bc.postMessage({type:'upd'});bc.close()}catch{}}
function loadSettings(){try{const r=localStorage.getItem(SETTINGS_KEY);return r?{...DEFAULT_SETTINGS,...JSON.parse(r)}:DEFAULT_SETTINGS}catch{return DEFAULT_SETTINGS}}
function saveSettings(s){localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
function calcEstimate(job,settings){
  const s={...settings,...(job.pricingOverrides||{})};
  const lines=[];let sub=0;
  job.trees.forEach(tree=>{
    const dbh=parseFloat(tree.dbh)||0;if(!dbh||!tree.workTypes.length)return;
    const dm=tree.difficulty==='confined'?s.multConfined:tree.difficulty==='crane'?s.multCrane:1.0;
    tree.workTypes.forEach(wt=>{
      let base=0,label='';
      if(wt==='removal'){base=dbh*s.rateRemoval*dm;label='Removal';}
      else if(['pruning','deadwood','clearance'].includes(wt)){base=dbh*s.ratePruning;label=WORK_TYPES.find(w=>w.id===wt)?.label||wt;}
      else if(wt==='stump'){base=dbh*s.rateStump;label='Stump Grind';}
      else if(wt==='debris'){base=s.rateDebrisHaul;label='Debris Haul';}
      else if(['treatment','spray','drench'].includes(wt)){base=s.rateTreatment;label=WORK_TYPES.find(w=>w.id===wt)?.label||wt;}
      else if(wt==='cabling'){base=200+dbh*10;label='Cabling/Bracing';}
      else if(wt==='assessment'){base=175;label='Risk Assessment';}
      if(base>0){const total=Math.round(base);sub+=total;lines.push({treeTag:tree.tag,treeName:tree.commonName||tree.species||tree.tag,work:label,dbh,total});}
    });
  });
  const tax=Math.round(sub*(s.taxRate||.04));
  return{lines,subtotal:sub,tax,total:sub+tax};
}

// UI COMPONENTS
function Btn({onClick,variant='outline',size='md',children,style={},disabled}){
  const base={fontFamily:'var(--font-body)',fontWeight:400,borderRadius:'var(--radius-sm)',cursor:disabled?'not-allowed':'pointer',opacity:disabled?.5:1,display:'inline-flex',alignItems:'center',gap:6,transition:'all .15s',whiteSpace:'nowrap'};
  const sz={sm:{fontSize:'.78rem',padding:'5px 12px'},md:{fontSize:'.85rem',padding:'8px 16px'},lg:{fontSize:'.95rem',padding:'11px 22px'}};
  const vr={primary:{background:'var(--green-mid)',color:'#fff',border:'1px solid var(--green-mid)'},outline:{background:'transparent',color:'var(--ink)',border:'1px solid var(--border)'},ghost:{background:'transparent',color:'var(--ink-soft)',border:'1px solid transparent'},danger:{background:'transparent',color:'var(--red)',border:'1px solid var(--red)'}};
  return <button onClick={disabled?undefined:onClick} style={{...base,...sz[size],...vr[variant],...style}}>{children}</button>;
}
function Card({children,style={},padding='18px 20px'}){return <div style={{background:'var(--white)',border:'1px solid var(--border-soft)',borderRadius:'var(--radius-lg)',padding,boxShadow:'0 1px 3px rgba(26,46,26,.08)',...style}}>{children}</div>}
function SLabel({children,style={}}){return <div style={{fontSize:'.7rem',fontWeight:500,color:'var(--ink-ghost)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:10,fontFamily:'var(--font-mono)',...style}}>{children}</div>}
function Badge({type,children}){const c=BADGE_COLORS[type]||BADGE_COLORS.cabling;return <span style={{background:c.bg,color:c.color,fontSize:'.7rem',fontWeight:500,padding:'3px 9px',borderRadius:99,fontFamily:'var(--font-mono)'}}>{children}</span>}
function StatusBadge({status}){const m={draft:{bg:'#f4f1eb',color:'#6b6b64',l:'Draft'},active:{bg:'#e8f0fc',color:'#1a3f7a',l:'Active'},scheduled:{bg:'#fdf3dc',color:'#7a4a0a',l:'Scheduled'},complete:{bg:'#f0f7ef',color:'#1a4a18',l:'Complete'}};const s=m[status]||m.draft;return <span style={{background:s.bg,color:s.color,fontSize:'.7rem',fontWeight:500,padding:'3px 9px',borderRadius:99,fontFamily:'var(--font-mono)'}}>{s.l}</span>}

// APP
function App(){
  const [jobs,setJobs]=useState(()=>loadJobs());
  const [settings,setSettings]=useState(()=>loadSettings());
  const [route,setRoute]=useState(()=>window.location.hash||'#/');

  useEffect(()=>{
    const h=()=>setRoute(window.location.hash||'#/');
    window.addEventListener('hashchange',h);
    let bc;try{bc=new BroadcastChannel('agmts');bc.onmessage=e=>{if(e.data?.type==='upd')setJobs(loadJobs())}}catch{}
    return()=>{window.removeEventListener('hashchange',h);bc?.close()};
  },[]);

  function nav(hash){window.location.hash=hash;}
  function updateJob(id,updater){setJobs(prev=>{const next=prev.map(j=>{if(j.id!==id)return j;const u=typeof updater==='function'?updater(j):{...j,...updater};return{...u,updatedAt:new Date().toISOString()}});saveJobs(next);return next});}
  function addJob(job){setJobs(prev=>{const next=[...prev,job];saveJobs(next);return next})}
  function deleteJob(id){setJobs(prev=>{const next=prev.filter(j=>j.id!==id);saveJobs(next);return next})}
  function updateSettings(u){setSettings(prev=>{const next={...prev,...u};saveSettings(next);return next})}

  const hash=route.replace('#','');
  let page='list',jobId=null,tab='intake';
  if(hash.startsWith('/job/')){const p=hash.split('/');jobId=p[2];tab=p[3]||'intake';page='job';}
  else if(hash==='/settings'){page='settings';}
  const currentJob=jobs.find(j=>j.id===jobId);

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <aside style={{width:205,flexShrink:0,background:'var(--green-dark)',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'20px 16px 16px',borderBottom:'1px solid rgba(255,255,255,.08)'}}>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <div style={{width:31,height:31,borderRadius:7,background:'var(--green-accent)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}}>🌳</div>
            <div>
              <div style={{fontFamily:'var(--font-display)',fontWeight:300,fontSize:'.88rem',color:'#fff',lineHeight:1.2}}>A Good Morning</div>
              <div style={{fontSize:'.6rem',color:'rgba(255,255,255,.4)',letterSpacing:'.08em',fontFamily:'var(--font-mono)'}}>TREE SERVICE</div>
            </div>
          </div>
        </div>
        <nav style={{flex:1,padding:'10px 8px'}}>
          {[{hash:'#/',label:'📋 Jobs'},{hash:'#/settings',label:'⚙️ Settings'}].map(({hash:h,label})=>{
            const active=h==='#/'?hash==='/'||hash==='':hash.startsWith(h.replace('#',''));
            return <button key={h} onClick={()=>nav(h)} style={{display:'flex',alignItems:'center',gap:8,width:'100%',padding:'10px 12px',borderRadius:6,border:'none',cursor:'pointer',background:active?'rgba(255,255,255,.12)':'transparent',color:active?'#fff':'rgba(255,255,255,.5)',fontSize:'.86rem',fontFamily:'var(--font-body)',marginBottom:2}}>{label}</button>;
          })}
        </nav>
        <div style={{padding:'12px 16px',borderTop:'1px solid rgba(255,255,255,.08)',fontSize:'.63rem',color:'rgba(255,255,255,.25)',fontFamily:'var(--font-mono)',lineHeight:1.8}}>Field Ops v1.0<br/>Kyle, TX</div>
      </aside>
      <main style={{flex:1,overflow:'auto'}}>
        {page==='list'&&<JobList jobs={jobs} addJob={addJob} deleteJob={deleteJob} nav={nav}/>}
        {page==='job'&&currentJob&&<JobDetail job={currentJob} updateJob={updateJob} settings={settings} nav={nav} activeTab={tab}/>}
        {page==='job'&&!currentJob&&<div style={{padding:40,textAlign:'center',color:'var(--ink-soft)'}}>Job not found. <Btn onClick={()=>nav('#/')}>Back to jobs</Btn></div>}
        {page==='settings'&&<Settings settings={settings} updateSettings={updateSettings}/>}
      </main>
    </div>
  );
}

// JOB LIST
function JobList({jobs,addJob,deleteJob,nav}){
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('all');
  function handleNew(){const job=createJob();addJob(job);nav(`#/job/${job.id}/intake`);}
  const filtered=jobs.filter(j=>filter==='all'||j.status===filter).filter(j=>{if(!search)return true;const q=search.toLowerCase();return j.clientName?.toLowerCase().includes(q)||j.address?.toLowerCase().includes(q)||j.jobNumber?.includes(q)}).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  const stats={total:jobs.length,active:jobs.filter(j=>j.status==='active').length,scheduled:jobs.filter(j=>j.status==='scheduled').length,draft:jobs.filter(j=>j.status==='draft').length};
  return(
    <div style={{padding:'26px 26px 40px',maxWidth:860,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div>
          <h1 style={{fontFamily:'var(--font-display)',fontWeight:300,fontSize:'1.75rem',letterSpacing:'-.01em'}}>Job Board</h1>
          <p style={{color:'var(--ink-soft)',fontSize:'.82rem',marginTop:3}}>Field assessments, estimates & crew assignments</p>
        </div>
        <Btn variant="primary" size="lg" onClick={handleNew}>+ New Job</Btn>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:10,marginBottom:20}}>
        {[{l:'Total',v:stats.total,c:'var(--ink)'},{l:'Active',v:stats.active,c:'var(--blue)'},{l:'Scheduled',v:stats.scheduled,c:'var(--amber)'},{l:'Drafts',v:stats.draft,c:'var(--ink-ghost)'}].map(s=>(
          <div key={s.l} style={{background:'var(--white)',border:'1px solid var(--border-soft)',borderRadius:'var(--radius-md)',padding:'12px 14px'}}>
            <div style={{fontSize:'.68rem',color:'var(--ink-soft)',fontFamily:'var(--font-mono)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>{s.l}</div>
            <div style={{fontSize:'1.75rem',fontWeight:300,fontFamily:'var(--font-display)',color:s.c}}>{s.v}</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:10,marginBottom:15,flexWrap:'wrap',alignItems:'center'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by client, address, job #…" style={{flex:1,minWidth:180}}/>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          {['all','active','scheduled','draft','complete'].map(f=>(
            <button key={f} onClick={()=>setFilter(f)} style={{padding:'6px 11px',borderRadius:'var(--radius-sm)',border:'1px solid '+(filter===f?'var(--green-accent)':'var(--border)'),background:filter===f?'var(--green-ghost)':'transparent',color:filter===f?'var(--green-mid)':'var(--ink-soft)',fontSize:'.77rem',cursor:'pointer',fontFamily:'var(--font-body)'}}>
              {f.charAt(0).toUpperCase()+f.slice(1)}
            </button>
          ))}
        </div>
      </div>
      {filtered.length===0?(
        <div style={{textAlign:'center',padding:'50px 20px',color:'var(--ink-soft)'}}>
          <div style={{fontSize:'2.2rem',marginBottom:12}}>🌳</div>
          <div style={{fontFamily:'var(--font-display)',fontWeight:300,fontSize:'1.15rem',color:'var(--ink-mid)',marginBottom:6}}>{jobs.length===0?'No jobs yet':'No results'}</div>
          <div style={{fontSize:'.82rem',marginBottom:18}}>{jobs.length===0?'Create your first field assessment to get started.':'Try adjusting your search.'}</div>
          {jobs.length===0&&<Btn variant="primary" onClick={handleNew}>+ Create First Job</Btn>}
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {filtered.map(job=>{
            const date=new Date(job.updatedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
            return(
              <div key={job.id} onClick={()=>nav(`#/job/${job.id}/intake`)} style={{background:'var(--white)',border:'1px solid var(--border-soft)',borderRadius:'var(--radius-lg)',padding:'13px 17px',cursor:'pointer',display:'flex',alignItems:'center',gap:13,flexWrap:'wrap'}}
                onMouseEnter={e=>e.currentTarget.style.boxShadow='0 4px 16px rgba(26,46,26,.1)'}
                onMouseLeave={e=>e.currentTarget.style.boxShadow=''}>
                <span style={{fontFamily:'var(--font-mono)',fontSize:'.72rem',color:'var(--ink-soft)',minWidth:78}}>#{job.jobNumber}</span>
                <div style={{flex:1,minWidth:150}}>
                  <div style={{fontWeight:500,fontSize:'.9rem',marginBottom:2}}>{job.clientName||<span style={{color:'var(--ink-ghost)',fontWeight:400}}>No client</span>}</div>
                  {job.address&&<div style={{fontSize:'.77rem',color:'var(--ink-soft)'}}>📍 {job.address}{job.city?`, ${job.city}`:''}</div>}
                </div>
                <div style={{fontSize:'.78rem',color:'var(--ink-soft)'}}>🌳 {job.trees?.length||0} trees</div>
                <div style={{fontFamily:'var(--font-mono)',fontSize:'.73rem',color:'var(--ink-ghost)'}}>{date}</div>
                <StatusBadge status={job.status}/>
                <button onClick={e=>{e.stopPropagation();if(confirm('Delete this job?'))deleteJob(job.id)}} style={{color:'var(--ink-ghost)',border:'none',background:'none',cursor:'pointer',fontSize:'.83rem',padding:'2px 5px'}}>✕</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// JOB DETAIL
function JobDetail({job,updateJob,settings,nav,activeTab}){
  const TABS=[{id:'intake',label:'Field Intake',icon:'📋'},{id:'estimate',label:'Estimate',icon:'💲'},{id:'scope',label:'Scope of Work',icon:'📄'},{id:'crew',label:'Crew Map',icon:'🗺️'}];
  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{background:'var(--white)',borderBottom:'1px solid var(--border-soft)',padding:'13px 20px',position:'sticky',top:0,zIndex:40}}>
        <div style={{display:'flex',alignItems:'center',gap:11,flexWrap:'wrap',marginBottom:11}}>
          <Btn variant="ghost" size="sm" onClick={()=>nav('#/')}>← Jobs</Btn>
          <div style={{width:1,height:17,background:'var(--border)'}}/>
          <span style={{fontFamily:'var(--font-mono)',fontSize:'.72rem',color:'var(--ink-soft)'}}>#{job.jobNumber}</span>
          <span style={{fontWeight:500}}>{job.clientName||'Unnamed Client'}</span>
          {job.address&&<span style={{fontSize:'.78rem',color:'var(--ink-soft)'}}>{job.address}{job.city?`, ${job.city}`:''}</span>}
          <select value={job.status} onChange={e=>updateJob(job.id,{status:e.target.value})} style={{width:'auto',fontSize:'.77rem',padding:'5px 9px',marginLeft:'auto',fontFamily:'var(--font-mono)'}}>
            <option value="draft">Draft</option><option value="active">Active</option>
            <option value="scheduled">Scheduled</option><option value="complete">Complete</option>
          </select>
        </div>
        <div style={{display:'flex',gap:2,overflowX:'auto'}}>
          {TABS.map(({id,label,icon})=>(
            <button key={id} onClick={()=>nav(`#/job/${job.id}/${id}`)} style={{display:'flex',alignItems:'center',gap:5,padding:'7px 12px',border:'none',cursor:'pointer',background:activeTab===id?'var(--green-ghost)':'transparent',color:activeTab===id?'var(--green-mid)':'var(--ink-soft)',borderBottom:activeTab===id?'2px solid var(--green-accent)':'2px solid transparent',fontFamily:'var(--font-body)',fontSize:'.82rem',fontWeight:activeTab===id?500:400,whiteSpace:'nowrap'}}>
              {icon} {label}
            </button>
          ))}
        </div>
      </div>
      <div style={{flex:1,overflow:'auto'}}>
        {activeTab==='intake'&&<IntakeTab job={job} updateJob={updateJob}/>}
        {activeTab==='estimate'&&<EstimateTab job={job} updateJob={updateJob} settings={settings}/>}
        {activeTab==='scope'&&<ScopeTab job={job} settings={settings}/>}
        {activeTab==='crew'&&<CrewMapTab job={job} updateJob={updateJob}/>}
      </div>
    </div>
  );
}

// INTAKE TAB
function IntakeTab({job,updateJob}){
  const [expanded,setExpanded]=useState(()=>job.trees.map(t=>t.id));
  function update(f,v){updateJob(job.id,{[f]:v})}
  function updateTree(tid,f,v){updateJob(job.id,j=>({...j,trees:j.trees.map(t=>t.id===tid?{...t,[f]:v}:t)}))}
  function toggleWork(tid,wid){updateJob(job.id,j=>({...j,trees:j.trees.map(t=>{if(t.id!==tid)return t;const has=t.workTypes.includes(wid);return{...t,workTypes:has?t.workTypes.filter(w=>w!==wid):[...t.workTypes,wid]}})}))}
  function addTree(){const t=createTree(job.trees.length+1);updateJob(job.id,j=>({...j,trees:[...j.trees,t]}));setExpanded(p=>[...p,t.id])}
  function removeTree(tid){if(!confirm('Remove this tree?'))return;updateJob(job.id,j=>({...j,trees:j.trees.filter(t=>t.id!==tid)}))}
  function toggleExpand(id){setExpanded(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id])}
  return(
    <div style={{padding:'20px 20px 40px',maxWidth:860,margin:'0 auto'}}>
      <Card style={{marginBottom:16}}>
        <SLabel>Property & client</SLabel>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:11,marginBottom:11}}>
          <div><label>Client name</label><input value={job.clientName} onChange={e=>update('clientName',e.target.value)} placeholder="Full name"/></div>
          <div><label>Phone</label><input value={job.clientPhone} onChange={e=>update('clientPhone',e.target.value)} placeholder="(512) 000-0000"/></div>
          <div><label>Email</label><input value={job.clientEmail} onChange={e=>update('clientEmail',e.target.value)} placeholder="email@example.com"/></div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 80px',gap:11,marginBottom:11}}>
          <div><label>Street address</label><input value={job.address} onChange={e=>update('address',e.target.value)} placeholder="123 Main St"/></div>
          <div><label>City</label><input value={job.city} onChange={e=>update('city',e.target.value)} placeholder="Kyle"/></div>
          <div><label>Zip</label><input value={job.zip} onChange={e=>update('zip',e.target.value)} placeholder="78640"/></div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 2fr',gap:11}}>
          <div><label>Site access</label>
            <select value={job.siteAccess} onChange={e=>update('siteAccess',e.target.value)}>
              <option value="open">Open — easy access</option>
              <option value="locked">Locked gate — key required</option>
              <option value="narrow">Narrow driveway</option>
              <option value="steep">Steep slope</option>
              <option value="restricted">Restricted — call ahead</option>
            </select>
          </div>
          <div><label>Site notes</label><input value={job.siteNotes} onChange={e=>update('siteNotes',e.target.value)} placeholder="Overhead lines, irrigation, fencing…"/></div>
        </div>
      </Card>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:11}}>
        <SLabel style={{margin:0}}>Tagged trees ({job.trees.length})</SLabel>
        <Btn variant="outline" size="sm" onClick={addTree}>+ Add tree</Btn>
      </div>
      {job.trees.map((tree,idx)=>{
        const isOpen=expanded.includes(tree.id);
        const pw=WORK_TYPES.find(w=>w.id===tree.workTypes[0]);
        return(
          <div key={tree.id} style={{background:'var(--white)',border:'1px solid var(--border-soft)',borderRadius:'var(--radius-lg)',marginBottom:9,overflow:'hidden'}}>
            <div onClick={()=>toggleExpand(tree.id)} style={{display:'flex',alignItems:'center',gap:9,padding:'12px 15px',cursor:'pointer',background:isOpen?'var(--green-ghost)':'var(--white)',borderBottom:isOpen?'1px solid var(--border-soft)':'none'}}>
              <span style={{background:'var(--green-mid)',color:'#fff',fontSize:'.71rem',fontWeight:500,padding:'2px 8px',borderRadius:99,fontFamily:'var(--font-mono)',flexShrink:0}}>{tree.tag||`T${idx+1}`}</span>
              <span style={{fontWeight:500,flex:1,fontSize:'.88rem'}}>{tree.commonName||tree.species||<span style={{color:'var(--ink-ghost)',fontWeight:400}}>Untitled tree</span>}{tree.dbh&&<span style={{color:'var(--ink-soft)',fontWeight:400,fontSize:'.78rem',marginLeft:7}}>{tree.dbh}" DBH</span>}</span>
              {pw&&<Badge type={pw.badge}>{pw.label}</Badge>}
              {tree.workTypes.length>1&&<span style={{fontSize:'.71rem',color:'var(--ink-ghost)',fontFamily:'var(--font-mono)'}}>+{tree.workTypes.length-1}</span>}
              <span style={{color:'var(--ink-ghost)',fontSize:'.82rem'}}>{isOpen?'▲':'▼'}</span>
            </div>
            {isOpen&&(
              <div style={{padding:'15px 15px 17px'}}>
                <div style={{display:'grid',gridTemplateColumns:'58px 1fr 1fr',gap:9,marginBottom:9}}>
                  <div><label>Tag</label><input value={tree.tag} onChange={e=>updateTree(tree.id,'tag',e.target.value)}/></div>
                  <div><label>Common name</label><input value={tree.commonName} onChange={e=>updateTree(tree.id,'commonName',e.target.value)} placeholder="Live Oak"/></div>
                  <div><label>Species</label><input value={tree.species} onChange={e=>updateTree(tree.id,'species',e.target.value)} placeholder="Quercus virginiana"/></div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'95px 95px 1fr 1fr',gap:9,marginBottom:9}}>
                  <div><label>DBH (in)</label><input type="number" min="1" value={tree.dbh} onChange={e=>updateTree(tree.id,'dbh',e.target.value)} placeholder="24"/></div>
                  <div><label>Height (ft)</label><input type="number" min="1" value={tree.height} onChange={e=>updateTree(tree.id,'height',e.target.value)} placeholder="48"/></div>
                  <div><label>Condition</label>
                    <select value={tree.condition} onChange={e=>updateTree(tree.id,'condition',e.target.value)}>
                      {['excellent','good','fair','poor','critical'].map(c=><option key={c} value={c}>{c.charAt(0).toUpperCase()+c.slice(1)}</option>)}
                    </select>
                  </div>
                  <div><label>Difficulty</label>
                    <select value={tree.difficulty} onChange={e=>updateTree(tree.id,'difficulty',e.target.value)}>
                      <option value="standard">Standard</option>
                      <option value="confined">Confined (1.35×)</option>
                      <option value="crane">Crane req. (1.6×)</option>
                    </select>
                  </div>
                </div>
                <div style={{marginBottom:9}}><label>Work type</label>
                  <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:5}}>
                    {WORK_TYPES.map(wt=>{const sel=tree.workTypes.includes(wt.id);return<button key={wt.id} onClick={()=>toggleWork(tree.id,wt.id)} style={{padding:'4px 10px',borderRadius:99,cursor:'pointer',border:'1px solid '+(sel?'var(--green-accent)':'var(--border)'),background:sel?'var(--green-ghost)':'var(--paper)',color:sel?'var(--green-mid)':'var(--ink-soft)',fontSize:'.76rem',fontFamily:'var(--font-body)',fontWeight:sel?500:400}}>{wt.label}</button>})}
                  </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,marginBottom:9}}>
                  <div><label>Field notes</label><textarea rows={3} value={tree.notes} onChange={e=>updateTree(tree.id,'notes',e.target.value)} placeholder="Observations, hazards, disease signs…"/></div>
                  <div><label>Access notes</label><textarea rows={3} value={tree.accessNotes} onChange={e=>updateTree(tree.id,'accessNotes',e.target.value)} placeholder="Equipment staging, utilities…"/></div>
                </div>
                <div style={{marginBottom:9}}><label>Photos</label>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:5,alignItems:'center'}}>
                    {tree.photos.map((p,pi)=>(
                      <div key={pi} style={{width:60,height:60,borderRadius:'var(--radius-md)',overflow:'hidden',border:'1px solid var(--border)',position:'relative',flexShrink:0}}>
                        <img src={p.url} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                        <button onClick={()=>updateTree(tree.id,'photos',tree.photos.filter((_,i)=>i!==pi))} style={{position:'absolute',top:2,right:2,width:16,height:16,borderRadius:'50%',background:'rgba(0,0,0,.55)',color:'#fff',border:'none',cursor:'pointer',fontSize:9,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
                      </div>
                    ))}
                    <label style={{width:60,height:60,borderRadius:'var(--radius-md)',border:'1.5px dashed var(--border)',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,color:'var(--ink-ghost)',fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.04em',background:'var(--paper)',flexShrink:0,margin:0}}>
                      📷<span>Add</span>
                      <input type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>{Array.from(e.target.files).forEach(file=>{const r=new FileReader();r.onload=ev=>updateJob(job.id,j=>({...j,trees:j.trees.map(t=>t.id===tree.id?{...t,photos:[...t.photos,{url:ev.target.result,name:file.name}]}:t)}));r.readAsDataURL(file)})}}/>
                    </label>
                  </div>
                </div>
                <div style={{display:'flex',justifyContent:'flex-end'}}>
                  <Btn variant="danger" size="sm" onClick={()=>removeTree(tree.id)}>🗑 Remove tree</Btn>
                </div>
              </div>
            )}
          </div>
        );
      })}
      <button onClick={addTree} style={{width:'100%',padding:15,border:'1.5px dashed var(--border)',borderRadius:'var(--radius-lg)',background:'transparent',color:'var(--ink-soft)',cursor:'pointer',fontSize:'.86rem',display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontFamily:'var(--font-body)'}}
        onMouseEnter={e=>e.currentTarget.style.background='var(--paper)'}
        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
        + Tag another tree or work zone
      </button>
    </div>
  );
}

// ESTIMATE TAB
function EstimateTab({job,updateJob,settings}){
  const [showPricing,setShowPricing]=useState(false);
  const overrides=job.pricingOverrides||{};
  const merged={...settings,...overrides};
  const est=calcEstimate(job,merged);
  const noTrees=job.trees.every(t=>!t.dbh||!t.workTypes.length);
  function setOverride(key,val){updateJob(job.id,j=>({...j,pricingOverrides:{...j.pricingOverrides,[key]:parseFloat(val)||val}}))}
  function handlePrint(){
    const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    const rows=est.lines.map(l=>`<tr><td>${l.treeTag}</td><td>${l.treeName}</td><td>${l.work}</td><td>${l.dbh}"</td><td style="text-align:right">$${l.total.toLocaleString()}</td></tr>`).join('');
    const win=window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>Estimate #${job.jobNumber}</title><style>body{font-family:Georgia,serif;max-width:700px;margin:40px auto;font-size:13px}h1{font-weight:300;font-size:21px}table{width:100%;border-collapse:collapse;margin-top:18px}th{font-size:11px;text-transform:uppercase;padding:8px;border-bottom:1px solid #ccc;text-align:left}td{padding:9px 8px;border-bottom:1px solid #eee}.tot{font-weight:600}@media print{body{margin:20px}}</style></head><body><h1>${settings.companyName||'Tree Service'}</h1><p style="color:#666">${date}</p><p><strong>Client:</strong> ${job.clientName||'—'} | <strong>Phone:</strong> ${job.clientPhone||'—'}<br><strong>Address:</strong> ${job.address||'—'}${job.city?', '+job.city:''}<br><strong>Job #:</strong> ${job.jobNumber}</p><table><thead><tr><th>Tag</th><th>Tree</th><th>Scope</th><th>DBH</th><th style="text-align:right">Amount</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="4" style="color:#888;padding:9px 8px">Subtotal</td><td style="text-align:right;padding:9px 8px">$${est.subtotal.toLocaleString()}</td></tr><tr><td colspan="4" style="color:#888;padding:6px 8px">Tax/permits</td><td style="text-align:right;padding:6px 8px">$${est.tax.toLocaleString()}</td></tr><tr class="tot"><td colspan="4" style="padding:10px 8px">Estimate Total</td><td style="text-align:right;padding:10px 8px">$${est.total.toLocaleString()}</td></tr></tfoot></table><p style="margin-top:28px;font-size:11px;color:#888">ISA Cert #: ${settings.isaNumber||'—'} | TDA License #: ${settings.tdaNumber||'—'}<br>${settings.companyName||''} · ${settings.phone||''} · ${settings.email||''}</p></body></html>`);
    win.document.close();win.print();
  }
  return(
    <div style={{padding:'20px 20px 40px',maxWidth:800,margin:'0 auto'}}>
      <div style={{background:'var(--white)',border:'1px solid var(--border-soft)',borderRadius:'var(--radius-lg)',marginBottom:16,overflow:'hidden'}}>
        <button onClick={()=>setShowPricing(s=>!s)} style={{width:'100%',padding:'12px 16px',border:'none',background:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',fontFamily:'var(--font-body)',fontSize:'.86rem',color:'var(--ink)'}}>
          <span style={{fontWeight:500}}>Pricing rules {Object.keys(overrides).length>0&&<span style={{color:'var(--amber)',fontSize:'.72rem',fontFamily:'var(--font-mono)'}}>(job override active)</span>}</span>
          <span>{showPricing?'▲':'▼'}</span>
        </button>
        {showPricing&&(
          <div style={{padding:'4px 16px 16px',borderTop:'1px solid var(--border-soft)'}}>
            <p style={{fontSize:'.77rem',color:'var(--ink-soft)',margin:'9px 0 13px'}}>Overrides default settings for this job only.</p>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(175px,1fr))',gap:10}}>
              {[{key:'rateRemoval',label:'Removal/DBH inch',pre:'$'},{key:'ratePruning',label:'Pruning/DBH inch',pre:'$'},{key:'rateTreatment',label:'Treatment flat',pre:'$'},{key:'rateStump',label:'Stump/DBH inch',pre:'$'},{key:'rateDebrisHaul',label:'Debris haul',pre:'$'},{key:'multConfined',label:'Confined mult.',pre:'×'},{key:'multCrane',label:'Crane mult.',pre:'×'},{key:'taxRate',label:'Tax rate',pre:''}].map(({key,label,pre})=>(
                <div key={key} style={{background:'var(--paper)',borderRadius:'var(--radius-md)',padding:'9px 11px'}}>
                  <label style={{marginBottom:5}}>{label}</label>
                  <div style={{display:'flex',alignItems:'center',gap:5}}>{pre&&<span style={{fontSize:'.82rem',color:'var(--ink-soft)'}}>{pre}</span>}<input type="number" step={key.includes('mult')||key==='taxRate'?'.01':'1'} value={overrides[key]??settings[key]??DEFAULT_SETTINGS[key]} onChange={e=>setOverride(key,e.target.value)}/></div>
                  {overrides[key]!==undefined&&<button onClick={()=>{const n={...overrides};delete n[key];updateJob(job.id,{pricingOverrides:n})}} style={{fontSize:'.7rem',color:'var(--ink-ghost)',background:'none',border:'none',cursor:'pointer',marginTop:3,padding:0,fontFamily:'var(--font-body)'}}>Reset</button>}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
      <Card style={{marginBottom:13,padding:0,overflow:'hidden'}}>
        <div style={{padding:'12px 17px',borderBottom:'1px solid var(--border-soft)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div><SLabel style={{marginBottom:2}}>Itemized estimate</SLabel><div style={{fontSize:'.77rem',color:'var(--ink-soft)'}}>{job.clientName||'Client'} · {job.address||'No address'} · Job #{job.jobNumber}</div></div>
          <Btn variant="outline" size="sm" onClick={handlePrint}>🖨 Print / PDF</Btn>
        </div>
        {noTrees?(
          <div style={{padding:'32px 17px',textAlign:'center',color:'var(--ink-ghost)',fontSize:'.86rem'}}>No trees with DBH and work types set. Complete Field Intake first.</div>
        ):(
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.82rem'}}>
            <thead><tr style={{background:'var(--paper)'}}>
              {['Tag','Tree','Scope','DBH','Amount'].map(h=><th key={h} style={{padding:'9px 13px',textAlign:h==='Amount'?'right':'left',fontFamily:'var(--font-mono)',fontSize:'.69rem',color:'var(--ink-soft)',fontWeight:500,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border-soft)',whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {est.lines.map((line,i)=>(
                <tr key={i} style={{borderBottom:'1px solid var(--border-soft)'}}>
                  <td style={{padding:'10px 13px'}}><span style={{background:'var(--green-mid)',color:'#fff',fontSize:'.69rem',fontWeight:500,padding:'2px 7px',borderRadius:99,fontFamily:'var(--font-mono)'}}>{line.treeTag}</span></td>
                  <td style={{padding:'10px 13px',color:'var(--ink-soft)',fontSize:'.79rem'}}>{line.treeName}</td>
                  <td style={{padding:'10px 13px'}}>{line.work}</td>
                  <td style={{padding:'10px 13px',fontFamily:'var(--font-mono)',fontSize:'.79rem',color:'var(--ink-soft)'}}>{line.dbh}"</td>
                  <td style={{padding:'10px 13px',textAlign:'right',fontFamily:'var(--font-mono)',fontWeight:500}}>${line.total.toLocaleString()}</td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr style={{borderTop:'1px solid var(--border)'}}><td colSpan={4} style={{padding:'9px 13px',color:'var(--ink-soft)',fontSize:'.79rem'}}>Subtotal</td><td style={{padding:'9px 13px',textAlign:'right',fontFamily:'var(--font-mono)'}}>${est.subtotal.toLocaleString()}</td></tr>
              <tr><td colSpan={4} style={{padding:'5px 13px',color:'var(--ink-soft)',fontSize:'.75rem'}}>Tax/permits ({((merged.taxRate||.04)*100).toFixed(0)}%)</td><td style={{padding:'5px 13px',textAlign:'right',fontFamily:'var(--font-mono)',fontSize:'.79rem',color:'var(--ink-soft)'}}>${est.tax.toLocaleString()}</td></tr>
              <tr style={{background:'var(--green-ghost)',borderTop:'1px solid var(--green-pale)'}}><td colSpan={4} style={{padding:'12px 13px',fontWeight:500,fontSize:'.97rem',fontFamily:'var(--font-display)',fontStyle:'italic'}}>Estimate total</td><td style={{padding:'12px 13px',textAlign:'right',fontFamily:'var(--font-mono)',fontWeight:500,fontSize:'1.12rem',color:'var(--green-mid)'}}>${est.total.toLocaleString()}</td></tr>
            </tfoot>
          </table>
        )}
      </Card>
      <Card><SLabel>Internal notes</SLabel><textarea rows={4} value={job.notes} onChange={e=>updateJob(job.id,{notes:e.target.value})} placeholder="Scheduling, equipment, crew assignments, client communications…" style={{marginTop:4}}/></Card>
    </div>
  );
}

// SCOPE TAB
function ScopeTab({job,settings}){
  const est=calcEstimate(job,settings);
  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const treesWithWork=job.trees.filter(t=>t.workTypes.length>0);
  const addr=[job.address,job.city,job.state,job.zip].filter(Boolean).join(', ');
  const condText={excellent:'is in excellent structural condition',good:'is in good condition with no significant defects observed',fair:'is in fair condition with some areas of concern noted',poor:'is in poor condition and exhibits significant structural deficiencies',critical:'is in critical condition and poses an elevated risk of failure'};
  function handlePrint(){
    const treeBlocks=treesWithWork.map(tree=>{const wl=tree.workTypes.map(wt=>WORK_TYPES.find(w=>w.id===wt)?.label||wt).join(', ');return `<h3 style="font-size:14px;margin:20px 0 8px">${tree.tag} — ${tree.commonName||tree.species||'Tree'}${tree.dbh?`, ${tree.dbh}" DBH`:''}</h3><div style="border-left:3px solid #c8e6c4;padding-left:14px;font-size:13px;line-height:1.8"><p><strong>Work:</strong> ${wl}.</p>${tree.notes?`<p><strong>Assessment:</strong> ${tree.notes}</p>`:''} ${tree.accessNotes?`<p><strong>Access:</strong> ${tree.accessNotes}</p>`:''}</div>`}).join('');
    const estRows=est.lines.map(l=>`<tr><td>${l.treeTag}</td><td>${l.work}</td><td style="text-align:right">$${l.total.toLocaleString()}</td></tr>`).join('');
    const win=window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>Scope of Work #${job.jobNumber}</title><style>body{font-family:Georgia,serif;max-width:700px;margin:40px auto;font-size:13px;color:#222;line-height:1.7}h1{font-size:23px;font-weight:300;color:#1a2e1a}h2{font-size:14px;font-weight:400;color:#555;margin:20px 0 8px;border-bottom:1px solid #eee;padding-bottom:5px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee}.tot{font-weight:600}@media print{body{margin:20px}}</style></head><body><h1>Scope of Work</h1><p><strong>Job #:</strong> ${job.jobNumber} | <strong>Date:</strong> ${date}</p><p><strong>Client:</strong> ${job.clientName||'—'} | <strong>Phone:</strong> ${job.clientPhone||'—'}</p><p><strong>Address:</strong> ${addr||'—'}</p><h2>Overview</h2><p>${settings.companyName||'This company'} has assessed ${treesWithWork.length} tree(s) at the above property. All work per ANSI A300 standards and applicable TDA requirements.</p>${job.siteNotes?`<p><strong>Site notes:</strong> ${job.siteNotes}</p>`:''}<h2>Tree Scope</h2>${treeBlocks}${est.lines.length?`<h2>Estimate</h2><table><thead><tr><th>Tag</th><th>Work</th><th style="text-align:right">Amount</th></tr></thead><tbody>${estRows}</tbody><tfoot><tr><td colspan="2">Tax/permits</td><td style="text-align:right">$${est.tax.toLocaleString()}</td></tr><tr class="tot"><td colspan="2">Total</td><td style="text-align:right">$${est.total.toLocaleString()}</td></tr></tfoot></table>`:''}<p style="margin-top:32px;font-size:11px;color:#888">ISA Cert #: ${settings.isaNumber||'—'} | TDA License #: ${settings.tdaNumber||'—'}<br>${settings.companyName||''} · ${settings.phone||''} · ${settings.email||''}</p></body></html>`);
    win.document.close();win.print();
  }
  return(
    <div style={{padding:'20px 20px 40px',maxWidth:800,margin:'0 auto'}}>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:13}}><Btn variant="outline" size="sm" onClick={handlePrint}>🖨 Print / export</Btn></div>
      <Card>
        <div style={{marginBottom:20,paddingBottom:17,borderBottom:'1px solid var(--border-soft)'}}>
          <div style={{fontFamily:'var(--font-display)',fontWeight:300,fontSize:'1.5rem',marginBottom:7,color:'var(--green-dark)'}}>Scope of Work</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'3px 16px',fontSize:'.82rem',color:'var(--ink-soft)'}}>
            <div><strong style={{color:'var(--ink)',fontWeight:500}}>Job #:</strong> {job.jobNumber}</div>
            <div><strong style={{color:'var(--ink)',fontWeight:500}}>Date:</strong> {date}</div>
            <div><strong style={{color:'var(--ink)',fontWeight:500}}>Client:</strong> {job.clientName||'—'}</div>
            <div><strong style={{color:'var(--ink)',fontWeight:500}}>Phone:</strong> {job.clientPhone||'—'}</div>
            <div style={{gridColumn:'1/-1'}}><strong style={{color:'var(--ink)',fontWeight:500}}>Address:</strong> {addr||'—'}</div>
          </div>
        </div>
        <div style={{marginBottom:20}}><SLabel>Overview</SLabel>
          <p style={{fontSize:'.85rem',lineHeight:1.8,color:'var(--ink-mid)'}}>{settings.companyName||'This company'} has assessed {treesWithWork.length} {treesWithWork.length===1?'tree':'trees'} at the above-referenced property on behalf of {job.clientName||'the property owner'}. The following scope of work was prepared following an on-site evaluation conducted by a licensed arborist. All work shall be performed in accordance with ANSI A300 pruning standards, applicable municipal ordinances, and applicable TDA pesticide application requirements.</p>
          {job.siteNotes&&<div style={{marginTop:9,padding:'8px 12px',background:'var(--amber-light)',borderRadius:'var(--radius-md)',fontSize:'.82rem',color:'var(--ink-mid)'}}><strong>Site notes:</strong> {job.siteNotes}</div>}
        </div>
        {treesWithWork.length===0?<div style={{padding:'28px 0',textAlign:'center',color:'var(--ink-ghost)',fontSize:'.85rem'}}>No trees with assigned work. Complete Field Intake to generate scope text.</div>
        :treesWithWork.map((tree,i)=>{
          const wl=tree.workTypes.map(wt=>WORK_TYPES.find(w=>w.id===wt)?.label||wt).join(', ');
          const hasTreatment=tree.workTypes.some(w=>['treatment','spray','drench'].includes(w));
          const hasCrane=tree.workTypes.includes('crane');
          const hasStump=tree.workTypes.includes('stump');
          return(
            <div key={tree.id} style={{marginBottom:i<treesWithWork.length-1?22:0,paddingBottom:i<treesWithWork.length-1?22:0,borderBottom:i<treesWithWork.length-1?'1px solid var(--border-soft)':'none'}}>
              <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:9}}>
                <span style={{background:'var(--green-mid)',color:'#fff',fontSize:'.71rem',fontWeight:500,padding:'3px 9px',borderRadius:99,fontFamily:'var(--font-mono)'}}>{tree.tag}</span>
                <span style={{fontWeight:500,fontSize:'.95rem'}}>{tree.commonName||tree.species||'Tree'}{tree.species&&tree.commonName?` (${tree.species})`:''}{tree.dbh&&<span style={{color:'var(--ink-soft)',fontWeight:400,fontSize:'.82rem',marginLeft:7}}>{tree.dbh}" DBH</span>}{tree.height&&<span style={{color:'var(--ink-soft)',fontWeight:400,fontSize:'.82rem',marginLeft:5}}>{tree.height}' ht.</span>}</span>
              </div>
              <div style={{borderLeft:'3px solid var(--green-pale)',paddingLeft:13}}>
                <p style={{fontSize:'.84rem',lineHeight:1.8,color:'var(--ink-mid)',marginBottom:7}}><strong>Recommended work:</strong> {wl}.</p>
                {tree.notes&&<p style={{fontSize:'.84rem',lineHeight:1.8,color:'var(--ink-mid)',marginBottom:7}}><strong>Assessment:</strong> The specimen {condText[tree.condition]||'has been assessed on site'}. {tree.notes}</p>}
                {(tree.accessNotes||hasCrane)&&<p style={{fontSize:'.84rem',lineHeight:1.8,color:'var(--ink-mid)',marginBottom:7}}><strong>Access & methodology:</strong> {tree.accessNotes||''}{hasCrane?' Crane access required.':''}</p>}
                {hasStump&&<p style={{fontSize:'.84rem',lineHeight:1.8,color:'var(--ink-mid)',marginBottom:7}}><strong>Stump:</strong> Stump grinding to grade is included in this scope.</p>}
                {hasTreatment&&<p style={{fontSize:'.84rem',lineHeight:1.8,color:'var(--ink-mid)'}}><strong>Regulatory note:</strong> A TDA Pesticide Applicator Record (Form Q527) will be completed and retained per 4 TAC §7.24. Client copy available upon request.</p>}
              </div>
            </div>
          );
        })}
        {est.lines.length>0&&(
          <div style={{marginTop:20,paddingTop:16,borderTop:'1px solid var(--border-soft)'}}>
            <SLabel>Estimate summary</SLabel>
            {est.lines.map((l,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:'.83rem',color:'var(--ink-mid)',lineHeight:2}}><span>{l.treeTag} — {l.work}</span><span style={{fontFamily:'var(--font-mono)'}}>${l.total.toLocaleString()}</span></div>)}
            <div style={{display:'flex',justifyContent:'space-between',borderTop:'1px solid var(--border-soft)',paddingTop:8,marginTop:5,fontWeight:500,fontSize:'.88rem'}}><span>Estimate total (incl. tax/permits)</span><span style={{fontFamily:'var(--font-mono)',color:'var(--green-mid)'}}>${est.total.toLocaleString()}</span></div>
          </div>
        )}
        <div style={{marginTop:22,paddingTop:17,borderTop:'1px solid var(--border-soft)',display:'flex',flexWrap:'wrap',gap:'5px 26px',fontSize:'.75rem',color:'var(--ink-soft)',fontFamily:'var(--font-mono)'}}>
          <span>ISA Cert #: {settings.isaNumber||'—'}</span>
          <span>TDA License #: {settings.tdaNumber||'—'}</span>
          <span>{settings.companyName||''}</span>
          <span>{settings.phone||''}</span>
        </div>
      </Card>
    </div>
  );
}

// CREW MAP TAB
function CrewMapTab({job,updateJob}){
  const [selected,setSelected]=useState(null);
  const [dragging,setDragging]=useState(null);
  const mapRef=useRef(null);
  const selectedTree=job.trees.find(t=>t.id===selected);
  function getCoords(e){const rect=mapRef.current.getBoundingClientRect();const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;return{x:Math.max(.04,Math.min(.96,(cx-rect.left)/rect.width)),y:Math.max(.04,Math.min(.96,(cy-rect.top)/rect.height))}}
  function onMove(e){if(!dragging)return;const c=getCoords(e);updateJob(job.id,j=>({...j,trees:j.trees.map(t=>t.id===dragging?{...t,mapX:c.x,mapY:c.y}:t)}))}
  function pinColor(tree){const wt=WORK_TYPES.find(w=>w.id===tree.workTypes[0]);return PIN_COLORS[wt?.badge]||'#4a8c3f'}
  return(
    <div style={{padding:'17px 20px 40px',maxWidth:900,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
        <div style={{flex:'1 1 360px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <SLabel style={{margin:0}}>Property map — drag pins to position</SLabel>
            <span style={{fontSize:'.69rem',color:'var(--ink-ghost)',fontFamily:'var(--font-mono)'}}>Tap to view task</span>
          </div>
          <div ref={mapRef} style={{position:'relative',background:'#d4edda',borderRadius:'var(--radius-lg)',border:'1px solid var(--border-soft)',overflow:'hidden',cursor:dragging?'grabbing':'default',userSelect:'none',touchAction:'none'}}
            onMouseMove={onMove} onMouseUp={()=>setDragging(null)} onMouseLeave={()=>setDragging(null)}
            onTouchMove={onMove} onTouchEnd={()=>setDragging(null)}>
            <svg viewBox="0 0 600 320" style={{width:'100%',display:'block'}}>
              <rect width="600" height="320" fill="#c8e6c4"/>
              <rect x="170" y="72" width="195" height="155" rx="6" fill="#e8d5b7" stroke="#c4a882" strokeWidth="1.5"/>
              <rect x="193" y="92" width="148" height="108" rx="2" fill="#f5ecd7"/>
              <text x="267" y="143" fill="#a07850" fontSize="10" textAnchor="middle" fontFamily="Georgia,serif">Residence</text>
              <rect x="170" y="227" width="195" height="70" fill="#b8d9b4" opacity="0.5"/>
              <rect x="0" y="290" width="600" height="30" fill="#bbb" opacity="0.4"/>
              <text x="300" y="308" fill="#666" fontSize="9" textAnchor="middle" fontFamily="monospace">Street</text>
              <text x="26" y="18" fill="#555" fontSize="9" fontFamily="monospace">↑ N</text>
            </svg>
            {job.trees.map(tree=>{
              const color=pinColor(tree);const isSel=selected===tree.id;
              return(
                <div key={tree.id} style={{position:'absolute',left:(tree.mapX||.5)*100+'%',top:(tree.mapY||.4)*100+'%',transform:'translate(-50%,-50%)',zIndex:isSel?10:5,cursor:'grab'}}
                  onMouseDown={e=>{e.preventDefault();setDragging(tree.id);setSelected(tree.id)}}
                  onTouchStart={()=>{setDragging(tree.id);setSelected(tree.id)}}
                  onClick={()=>setSelected(tree.id)}>
                  <div style={{width:isSel?33:27,height:isSel?33:27,borderRadius:'50%',background:color,border:isSel?'3px solid white':'2px solid rgba(255,255,255,.7)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:isSel?'0 2px 10px rgba(0,0,0,.3)':'0 1px 4px rgba(0,0,0,.2)',transition:'all .15s'}}>
                    <span style={{color:'white',fontSize:isSel?'.68rem':'.62rem',fontWeight:600,fontFamily:'var(--font-mono)'}}>{tree.tag}</span>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:8}}>
            {Object.entries(PIN_COLORS).map(([type,color])=>(
              <div key={type} style={{display:'flex',alignItems:'center',gap:4,fontSize:'.71rem',color:'var(--ink-soft)'}}>
                <div style={{width:9,height:9,borderRadius:'50%',background:color}}/>{type.charAt(0).toUpperCase()+type.slice(1)}
              </div>
            ))}
          </div>
        </div>
        <div style={{flex:'1 1 230px',minWidth:220}}>
          <SLabel>Task detail</SLabel>
          {!selectedTree?(
            <div style={{background:'var(--paper)',borderRadius:'var(--radius-lg)',border:'1px dashed var(--border)',padding:'28px 16px',textAlign:'center',color:'var(--ink-ghost)',fontSize:'.83rem'}}>Tap a pin to view task details</div>
          ):(
            <div style={{background:'var(--white)',border:'1px solid var(--border-soft)',borderRadius:'var(--radius-lg)',padding:14}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                <span style={{background:pinColor(selectedTree),color:'#fff',fontSize:'.74rem',fontWeight:600,padding:'3px 9px',borderRadius:99,fontFamily:'var(--font-mono)'}}>{selectedTree.tag}</span>
                <div><div style={{fontWeight:500,fontSize:'.9rem'}}>{selectedTree.commonName||selectedTree.species||'Tree'}</div>
                {selectedTree.dbh&&<div style={{fontSize:'.73rem',color:'var(--ink-soft)',fontFamily:'var(--font-mono)'}}>{selectedTree.dbh}" DBH · {selectedTree.condition}</div>}</div>
              </div>
              <div style={{marginBottom:10}}>
                <div style={{fontSize:'.69rem',fontWeight:500,color:'var(--ink-ghost)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4,fontFamily:'var(--font-mono)'}}>Work assigned</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{selectedTree.workTypes.map(wt=>{const f=WORK_TYPES.find(w=>w.id===wt);const c=BADGE_COLORS[f?.badge]||{};return<span key={wt} style={{background:c.bg,color:c.color,fontSize:'.69rem',padding:'3px 8px',borderRadius:99,fontWeight:500}}>{f?.label||wt}</span>})}</div>
              </div>
              {selectedTree.notes&&<div style={{marginBottom:8}}><div style={{fontSize:'.69rem',fontWeight:500,color:'var(--ink-ghost)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3,fontFamily:'var(--font-mono)'}}>Field notes</div><p style={{fontSize:'.79rem',lineHeight:1.65,color:'var(--ink-mid)'}}>{selectedTree.notes}</p></div>}
              {selectedTree.accessNotes&&<div style={{marginBottom:8,padding:'7px 10px',background:'var(--amber-light)',borderRadius:'var(--radius-sm)'}}><div style={{fontSize:'.69rem',fontWeight:500,color:'var(--amber)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:2,fontFamily:'var(--font-mono)'}}>Access / hazard</div><p style={{fontSize:'.78rem',lineHeight:1.6,color:'#7a4a0a'}}>{selectedTree.accessNotes}</p></div>}
              {selectedTree.photos?.length>0&&<div style={{marginBottom:8}}><div style={{fontSize:'.69rem',fontWeight:500,color:'var(--ink-ghost)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4,fontFamily:'var(--font-mono)'}}>Photos</div><div style={{display:'flex',gap:5,flexWrap:'wrap'}}>{selectedTree.photos.map((p,i)=><img key={i} src={p.url} alt="" style={{width:54,height:54,objectFit:'cover',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)'}}/>)}</div></div>}
              <div style={{paddingTop:10,borderTop:'1px solid var(--border-soft)'}}><div style={{fontSize:'.69rem',fontWeight:500,color:'var(--ink-ghost)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6,fontFamily:'var(--font-mono)'}}>All tags</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:5}}>{job.trees.map(tree=><button key={tree.id} onClick={()=>setSelected(tree.id)} style={{background:selected===tree.id?pinColor(tree):'var(--paper)',color:selected===tree.id?'#fff':'var(--ink-soft)',border:'1px solid '+(selected===tree.id?pinColor(tree):'var(--border)'),borderRadius:99,padding:'3px 9px',cursor:'pointer',fontSize:'.71rem',fontFamily:'var(--font-mono)',fontWeight:500}}>{tree.tag}</button>)}</div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// SETTINGS
function Settings({settings,updateSettings}){
  function set(key,val){updateSettings({[key]:val})}
  return(
    <div style={{padding:'24px 24px 60px',maxWidth:700,margin:'0 auto'}}>
      <h1 style={{fontFamily:'var(--font-display)',fontWeight:300,fontSize:'1.75rem',marginBottom:5}}>Settings</h1>
      <p style={{color:'var(--ink-soft)',fontSize:'.82rem',marginBottom:24}}>Company info and default pricing. Applies to all new jobs.</p>
      <Card style={{marginBottom:16}}>
        <SLabel>Company information</SLabel>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(195px,1fr))',gap:11}}>
          <div style={{gridColumn:'1/-1'}}><label>Company name</label><input value={settings.companyName} onChange={e=>set('companyName',e.target.value)}/></div>
          <div><label>Phone</label><input value={settings.phone} onChange={e=>set('phone',e.target.value)}/></div>
          <div><label>Email</label><input value={settings.email} onChange={e=>set('email',e.target.value)}/></div>
          <div><label>ISA Cert #</label><input value={settings.isaNumber} onChange={e=>set('isaNumber',e.target.value)}/></div>
          <div><label>TDA License #</label><input value={settings.tdaNumber} onChange={e=>set('tdaNumber',e.target.value)}/></div>
        </div>
      </Card>
      <Card style={{marginBottom:16}}>
        <SLabel>Default pricing rules</SLabel>
        <p style={{fontSize:'.77rem',color:'var(--ink-soft)',marginBottom:13}}>Used for all jobs. Override per-job on the Estimate tab.</p>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(195px,1fr))',gap:11}}>
          {[{key:'rateRemoval',label:'Removal per DBH inch',pre:'$'},{key:'ratePruning',label:'Pruning per DBH inch',pre:'$'},{key:'rateTreatment',label:'Treatment flat rate',pre:'$'},{key:'rateStump',label:'Stump grind per DBH inch',pre:'$'},{key:'rateDebrisHaul',label:'Debris haul flat',pre:'$'}].map(({key,label,pre})=>(
            <div key={key}><label>{label}</label><div style={{display:'flex',alignItems:'center',gap:5}}><span style={{color:'var(--ink-soft)',fontSize:'.82rem'}}>{pre}</span><input type="number" min="0" value={settings[key]} onChange={e=>set(key,parseFloat(e.target.value)||0)}/></div></div>
          ))}
        </div>
      </Card>
      <Card style={{marginBottom:16}}>
        <SLabel>Difficulty multipliers</SLabel>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(195px,1fr))',gap:13}}>
          <div><label>Confined felling ({settings.multConfined}×)</label><input type="range" min="1" max="2.5" step="0.05" value={settings.multConfined} onChange={e=>set('multConfined',parseFloat(e.target.value))}/></div>
          <div><label>Crane required ({settings.multCrane}×)</label><input type="range" min="1" max="3" step="0.05" value={settings.multCrane} onChange={e=>set('multCrane',parseFloat(e.target.value))}/></div>
          <div><label>Tax / permit rate ({(settings.taxRate*100).toFixed(0)}%)</label><input type="range" min="0" max="0.15" step="0.005" value={settings.taxRate} onChange={e=>set('taxRate',parseFloat(e.target.value))}/></div>
        </div>
      </Card>
      <div style={{background:'var(--green-ghost)',borderRadius:'var(--radius-md)',padding:'12px 16px',border:'1px solid var(--green-pale)',fontSize:'.81rem',color:'var(--green-mid)'}}>
        <strong>Data storage:</strong> All jobs save to your browser automatically. To share across devices, see the README for Supabase integration instructions (free, ~30 min setup).
      </div>
    </div>
  );
}

// BOOT
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
