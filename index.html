<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a3018"/>
<title>Arborist Field Tool</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCk2htunVqapy9aiYIsBDAalFbFkqZL1Mw&libraries=places&loading=async" async defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" defer></script>
<style>
#app-root {
  all: initial;
  display: block;
  width: 100%;
  height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, Roboto, sans-serif;
  background: #f7f7f5;
  color: #111;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  --g: #1a3018;
  --g2: #2d5a27;
  --bg: #f7f7f5;
  --card: #fff;
  --b: #e5e5e0;
  --ink: #111;
  --ink2: #555;
  --ink3: #888;
  --r: 12px;
  --r2: 20px;
  --r3: 28px;
  --red: #c0392b;
  --amber: #b87a00;
}
#app-root *, #app-root *::before, #app-root *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: inherit;
}
#app-root input, #app-root select, #app-root textarea {
  font-family: inherit;
  font-size: 16px;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  padding: 14px 16px;
  width: 100%;
  outline: none;
  -webkit-appearance: none;
}
#app-root input:focus, #app-root textarea:focus, #app-root select:focus {
  border-color: var(--g2);
  box-shadow: 0 0 0 4px rgba(45,90,39,.12);
}
#app-root textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
#app-root button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  -webkit-tap-highlight-color: transparent;
}
#app-root .leaflet-container { font-family: inherit !important; }

/* HOME */
#app-root .home {
  height: 100vh;
  width: 100%;
  position: relative;
  overflow: hidden;
}
#app-root .home-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #1a3018 0%, #2d5a27 50%, #4a8c3f 100%);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'><defs><radialGradient id='g' cx='50%25' cy='40%25'><stop offset='0%25' stop-color='%234a8c3f'/><stop offset='100%25' stop-color='%231a3018'/></radialGradient></defs><rect fill='url(%23g)' width='800' height='600'/><g opacity='0.4'><circle cx='100' cy='200' r='80' fill='%232d5a27'/><circle cx='300' cy='150' r='100' fill='%23244a20'/><circle cx='500' cy='220' r='90' fill='%232d5a27'/><circle cx='700' cy='180' r='70' fill='%23244a20'/><circle cx='150' cy='450' r='110' fill='%232d5a27'/><circle cx='400' cy='480' r='130' fill='%23244a20'/><circle cx='650' cy='450' r='95' fill='%232d5a27'/></g></svg>");
  background-size: cover;
  background-position: center;
  filter: blur(4px);
  transform: scale(1.05);
}
#app-root .home-overlay {
  position: absolute;
  inset: 0;
  background: rgba(13, 26, 13, 0.35);
}
#app-root .home-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px 140px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#app-root .home-search {
  width: 100%;
  max-width: 480px;
  position: relative;
}
#app-root .home-title-block {
  text-align: center;
  margin-bottom: 24px;
  color: #fff;
}
#app-root .home-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
#app-root .home-subtitle {
  font-size: 15px;
  color: rgba(255,255,255,0.85);
  font-weight: 500;
}
#app-root .home-status {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 12px;
  background: rgba(255,255,255,0.96);
  border-radius: var(--r);
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink2);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 8px;
}
#app-root .home-status-warn { color: var(--amber); }
#app-root .home-status-err { color: var(--red); }
#app-root .home-spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--b);
  border-top-color: var(--g2);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Google Places Autocomplete dropdown — escapes #app-root since Google appends to body */
.pac-container {
  background: #fff !important;
  border-radius: 16px !important;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25) !important;
  border: none !important;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif !important;
  margin-top: 8px !important;
  overflow: hidden !important;
  z-index: 10000 !important;
}
.pac-item {
  padding: 12px 16px !important;
  font-size: 14px !important;
  cursor: pointer !important;
  border-top: 1px solid #f0f0f0 !important;
  line-height: 1.5 !important;
}
.pac-item:first-child {
  border-top: none !important;
}
.pac-item:hover {
  background: #f0f7ef !important;
}
.pac-item-query {
  font-size: 14px !important;
  font-weight: 600 !important;
  color: #111 !important;
}
.pac-matched {
  font-weight: 700 !important;
}
.pac-icon {
  margin-right: 10px !important;
}

#app-root .home-hint {
  margin-top: 16px;
  text-align: center;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: -0.01em;
}

#app-root .home-search input:disabled {
  opacity: 0.6;
  cursor: wait;
}

/* HOME TOP BAR (user/calendar) */
#app-root .home-top-bar {
  position: absolute;
  top: max(12px, env(safe-area-inset-top, 12px));
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  z-index: 5;
}
#app-root .home-cal-btn {
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 16px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  color: var(--ink);
  border: none;
}
#app-root .home-cal-btn:active { transform: scale(0.95); }
#app-root .home-cal-label { font-size: 13px; }
#app-root .home-user {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.96);
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  border: 2px solid #fff;
}
#app-root .home-user img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#app-root .home-user-initial {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--g2);
  color: #fff;
  font-weight: 700;
  font-size: 16px;
}

/* LOGIN SCREEN */
#app-root .login-screen {
  position: relative;
  height: 100vh;
  width: 100%;
  overflow: hidden;
}
#app-root .login-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #1a3018 0%, #2d5a27 50%, #4a8c3f 100%);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'><defs><radialGradient id='g' cx='50%25' cy='40%25'><stop offset='0%25' stop-color='%234a8c3f'/><stop offset='100%25' stop-color='%231a3018'/></radialGradient></defs><rect fill='url(%23g)' width='800' height='600'/><g opacity='0.4'><circle cx='100' cy='200' r='80' fill='%232d5a27'/><circle cx='300' cy='150' r='100' fill='%23244a20'/><circle cx='500' cy='220' r='90' fill='%232d5a27'/><circle cx='700' cy='180' r='70' fill='%23244a20'/><circle cx='150' cy='450' r='110' fill='%232d5a27'/><circle cx='400' cy='480' r='130' fill='%23244a20'/><circle cx='650' cy='450' r='95' fill='%232d5a27'/></g></svg>");
  background-size: cover;
  background-position: center;
  filter: blur(4px);
  transform: scale(1.05);
}
#app-root .login-overlay {
  position: absolute;
  inset: 0;
  background: rgba(13, 26, 13, 0.45);
}
#app-root .login-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
}
#app-root .login-emoji { font-size: 64px; margin-bottom: 12px; }
#app-root .login-title {
  color: #fff;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
#app-root .login-subtitle {
  color: rgba(255,255,255,0.85);
  font-size: 15px;
  margin-bottom: 32px;
  max-width: 320px;
  line-height: 1.5;
}
#app-root .login-google-btn {
  display: flex;
  justify-content: center;
  min-height: 44px;
  margin-bottom: 16px;
}
#app-root .login-err {
  color: #ffb4b4;
  font-size: 13px;
  margin-top: 8px;
}
#app-root .login-skip {
  margin-top: 24px;
  color: rgba(255,255,255,0.85);
  font-size: 14px;
  font-weight: 500;
  background: transparent;
  border: none;
  text-decoration: underline;
  text-underline-offset: 4px;
}

/* CALENDAR MODAL */
#app-root .cal-status {
  text-align: center;
  padding: 32px 16px;
  color: var(--ink2);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
#app-root .cal-status-err { color: var(--red); flex-direction: column; }
#app-root .cal-section {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 18px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--b);
}
#app-root .cal-section:first-child { margin-top: 0; }
#app-root .cal-ev {
  border: 1.5px solid var(--b);
  border-radius: var(--r);
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
}
#app-root .cal-ev:active { background: var(--bg); }
#app-root .cal-ev.sel {
  border-color: var(--g2);
  background: #f0f7ef;
  box-shadow: 0 0 0 3px rgba(45,90,39,0.1);
}
#app-root .cal-ev-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.01em;
}
#app-root .cal-ev-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--g);
  margin-top: 4px;
}
#app-root .cal-ev-date.past { color: var(--ink3); }
#app-root .cal-ev-meta {
  font-size: 12px;
  color: var(--ink2);
  margin-top: 3px;
}

#app-root .home-search input {
  width: 100%;
  padding: 22px 22px 22px 58px;
  font-size: 17px;
  border-radius: var(--r3);
  border: none;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  font-weight: 500;
}
#app-root .home-search-icon {
  position: absolute;
  left: 22px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink3);
  pointer-events: none;
}
#app-root .home-suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 12px;
  background: #fff;
  border-radius: var(--r2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  overflow: hidden;
  max-height: 320px;
  overflow-y: auto;
}
#app-root .home-sug {
  padding: 16px 20px;
  border-bottom: 1px solid var(--b);
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
#app-root .home-sug:last-child { border-bottom: none; }
#app-root .home-sug:active { background: var(--bg); }
#app-root .home-recent {
  position: absolute;
  bottom: 32px;
  left: 24px;
  right: 24px;
  z-index: 2;
}
#app-root .home-recent-label {
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  text-align: center;
}
#app-root .home-recent-list {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0;
}
#app-root .home-recent-item {
  flex-shrink: 0;
  background: rgba(255,255,255,0.95);
  padding: 10px 16px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}

/* PROPERTY (MAP) */
#app-root .prop {
  position: relative;
  height: 100vh;
  width: 100%;
  overflow: hidden;
}
#app-root .map { width: 100%; height: 100%; background: #ddd; }

/* Top bar */
#app-root .prop-topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 10px 12px calc(10px + env(safe-area-inset-top, 0px));
  padding-top: max(10px, env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 1000;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
#app-root .prop-back {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--ink);
}
#app-root .prop-back:active {
  background: var(--b);
  transform: scale(0.95);
}
#app-root .prop-addr {
  flex: 1;
  min-width: 0;
}
#app-root .prop-addr-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#app-root .prop-addr-sub {
  font-size: 12px;
  color: var(--ink3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#app-root .prop-estimate-btn {
  background: var(--g2);
  color: #fff;
  padding: 10px 16px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  letter-spacing: -0.01em;
}
#app-root .prop-estimate-btn:active {
  transform: scale(0.95);
  background: var(--g);
}

/* Floating Add Pin button */
#app-root .prop-fab-wrap {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  pointer-events: none;
}
#app-root .prop-fab {
  pointer-events: auto;
  background: var(--g2);
  color: #fff;
  padding: 16px 28px;
  border-radius: 99px;
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  letter-spacing: -0.01em;
  border: 3px solid #fff;
}
#app-root .prop-fab:active {
  transform: scale(0.96);
}
#app-root .prop-fab-cancel {
  background: var(--red);
}

#app-root .map-banner {
  position: absolute;
  top: 80px;
  left: 12px;
  right: 12px;
  background: var(--g);
  color: #fff;
  padding: 12px 18px;
  border-radius: var(--r);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  z-index: 1000;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
#app-root .tree-marker {
  background: var(--g2);
  color: #fff;
  border: 2.5px solid #fff;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 11px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  cursor: pointer;
  line-height: 1;
}

/* BOTTOM SHEET */
#app-root .sheet-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1500;
  animation: fade .2s;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
#app-root .sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-radius: var(--r3) var(--r3) 0 0;
  z-index: 1501;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  animation: slideup .3s cubic-bezier(0.4,0,0.2,1);
  padding-bottom: env(safe-area-inset-bottom);
}
#app-root .sheet-handle {
  padding: 10px 0 4px;
  display: flex;
  justify-content: center;
  flex-shrink: 0;
}
#app-root .sheet-grip {
  width: 44px;
  height: 5px;
  background: var(--b);
  border-radius: 99px;
}
#app-root .sheet-head {
  padding: 6px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 1px solid var(--b);
}
#app-root .sheet-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
#app-root .sheet-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink2);
}
#app-root .sheet-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 20px 100px;
}
#app-root .sheet-foot {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--b);
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
}

/* SHEET SECTIONS */
#app-root .sec {
  margin-bottom: 24px;
}
#app-root .sec-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}

/* CAMERA */
#app-root .cam-area {
  position: relative;
  width: 100%;
  background: #000;
  border-radius: var(--r2);
  overflow: hidden;
  aspect-ratio: 4/3;
}
#app-root .cam-canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#app-root .cam-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: rgba(255,255,255,0.6);
  gap: 8px;
}
#app-root .cam-tools {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  gap: 6px;
  justify-content: center;
}
#app-root .cam-tool {
  background: rgba(255,255,255,0.9);
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}
#app-root .cam-add-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
#app-root .cam-add-btn {

const compress = (file) => new Promise(res => {
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(url);
    const s = Math.min(1, 1400 / Math.max(img.width, img.height));
    const w = Math.round(img.width * s), h = Math.round(img.height * s);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);

// Geocode an address string -> {lat, lng, label} for Calendar import.
// Uses Google Geocoder if loaded, falls back to Nominatim.
const search = async (q) => {
  if (!q || q.length < 3) return [];
  // Try Google first
  if (window.google && window.google.maps && window.google.maps.Geocoder) {
    try {
      const geocoder = new window.google.maps.Geocoder();
      const results = await new Promise((resolve, reject) => {
        geocoder.geocode({ address: q }, (results, status) => {
          if (status === 'OK' && results) resolve(results);
          else reject(new Error(status));
        });
      });
      return results.slice(0, 5).map(r => ({
        label: r.formatted_address,
        lat: r.geometry.location.lat(),
        lng: r.geometry.location.lng(),
      }));
    } catch (e) {
      // fall through to Nominatim
    }
  }
  // Fallback: Nominatim
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=' + encodeURIComponent(q);
    const r = await fetch(url);
    if (!r.ok) return [];
    const d = await r.json();
    return d.map(x => ({ label: x.display_name, lat: parseFloat(x.lat), lng: parseFloat(x.lon) }));
  } catch (e) {
    console.error('Geocode error:', e);
    return [];
  }
};

// Get OAuth token for Calendar API access
const getCalendarToken = () => new Promise((resolve, reject) => {
  if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
    reject(new Error('Google Sign-In not loaded'));
    return;
  }
  const client = window.google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.readonly',
    callback: (resp) => {
      if (resp.error) { reject(new Error(resp.error)); return; }
      resolve(resp.access_token);
    },
  });
  client.requestAccessToken({ prompt: '' });
});

// Fetch all calendar events for the entire current year
const fetchCalendarEvents = async () => {
  const token = await getCalendarToken();
  const now = new Date();
  const year = now.getFullYear();
  const yearStart = new Date(year, 0, 1, 0, 0, 0, 0);
  const yearEnd = new Date(year, 11, 31, 23, 59, 59, 999);
  const min = encodeURIComponent(yearStart.toISOString());
  const max = encodeURIComponent(yearEnd.toISOString());

  const baseUrl = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
    + '?timeMin=' + min + '&timeMax=' + max
    + '&singleEvents=true&orderBy=startTime&showDeleted=false&maxResults=250';
  const headers = { Authorization: 'Bearer ' + token };

  const all = [];
  let pageToken = '';
  let safety = 0;
  do {
    const url = baseUrl + (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
    const r = await fetch(url, { headers });
    if (!r.ok) throw new Error('Calendar API error ' + r.status);
    const data = await r.json();
    (data.items || []).forEach(e => all.push(e));
    pageToken = data.nextPageToken || '';
    safety++;
  } while (pageToken && safety < 20);

  // Filter out cancelled and declined events
  return all.filter(e => {
    if (e.status === 'cancelled') return false;
    const me = (e.attendees || []).find(a => a.self);
    if (me && me.responseStatus === 'declined') return false;
    return true;
  }).map(e => ({
    id: e.id,
    title: e.summary || 'Untitled',
    start: (e.start && (e.start.dateTime || e.start.date)) || '',
    description: e.description || '',
    location: e.location || '',
  }));
};

// Parse calendar event into a property record
const parseEventToProperty = async (ev) => {
  let lat = null, lng = null;
  let label = ev.location || ev.title;
  // Try to geocode the location
  if (ev.location && ev.location.length > 5) {
    const results = await search(ev.location);
    if (results.length > 0) {
      lat = results[0].lat;
      lng = results[0].lng;
      label = results[0].label;
    }
  }
  // Strip common prefixes from title
  const clientName = ev.title.replace(/^(estimate|assessment|job|site visit|consult|quote|bid)[:\s\-]*/i, '').trim();
  return {
    id: uid(),
    address: label,
    lat: lat || 30.267,
    lng: lng || -97.743,
    pins: [],
    created: Date.now(),
    importedFrom: 'gcal',
    eventDate: ev.start,
    clientName,
    eventNotes: ev.description || '',
  };
};

const formatEventDate = (startIso) => {
  if (!startIso) return { main: '', sub: '', isPast: false };
  const d = new Date(startIso);
  const isPast = d < new Date();
  const hasTime = startIso.length > 10;
  const main = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const sub = hasTime
    ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
    : 'All day';
  return { main, sub, isPast, dateObj: d };
};

      try {
        window.google.accounts.id.initialize({

          callback: (resp) => {
            try {
              const payload = JSON.parse(atob(resp.credential.split('.')[1]));
              const user = {
                id: payload.sub,
                name: payload.name || payload.email,
                email: payload.email,
                picture: payload.picture || '',
              };
              saveSession(user);
              onLogin(user);
            } catch (e) {
              setErr('Sign-in failed. Try again.');

          },
          auto_select: false,

        if (btnRef.current) {
          window.google.accounts.id.renderButton(btnRef.current, {

function CalendarModal({ onImport, onClose }) {
  const [state, setState] = useState('loading'); // loading, list, empty, error
  const [events, setEvents] = useState([]);
  const [sel, setSel] = useState(null);
  const [err, setErr] = useState('');
  const [query, setQuery] = useState('');
  const [importing, setImporting] = useState(false);

  useEffect(() => {
    fetchCalendarEvents()
      .then(evs => {
        setEvents(evs);
        setState(evs.length ? 'list' : 'empty');
      })
      .catch(e => {
        setErr(e.message || 'Could not load calendar.');
        setState('error');
      });
  }, []);

  const filtered = events.filter(ev => {
    if (!query) return true;
    const q = query.toLowerCase();
    return ev.title.toLowerCase().includes(q)
      || ev.location.toLowerCase().includes(q)
      || ev.description.toLowerCase().includes(q);
  });
  const now = new Date();
  const upcoming = filtered.filter(e => new Date(e.start) >= now);
  const past = filtered.filter(e => new Date(e.start) < now).reverse();

  const doImport = async () => {
    const ev = events.find(e => e.id === sel);
    if (!ev) return;
    setImporting(true);
    try {
      const prop = await parseEventToProperty(ev);
      onImport(prop);
      onClose();
    } catch (e) {
      alert('Import failed: ' + e.message);
      setImporting(false);
    }
  };

  const renderEvent = (ev) => {
    const dt = formatEventDate(ev.start);
    return (
      <div
        key={ev.id}
        className={'cal-ev' + (sel === ev.id ? ' sel' : '')}
        onClick={() => setSel(ev.id)}
      >
        <div className="cal-ev-title">{ev.title}</div>
        <div className={'cal-ev-date' + (dt.isPast ? ' past' : '')}>
          📅 {dt.main}<span style={{ opacity: 0.75, marginLeft: 6 }}>· {dt.sub}</span>
        </div>
        {ev.location && <div className="cal-ev-meta">📍 {ev.location}</div>}
      </div>
    );
  };

  return (
    <>
      <div className="sheet-bg" onClick={onClose}></div>
      <div className="sheet" style={{ maxHeight: '92vh' }}>
        <div className="sheet-handle"><div className="sheet-grip"></div></div>
        <div className="sheet-head">
          <div className="sheet-title">📅 Import from Calendar</div>
          <div className="sheet-close" onClick={onClose}><Ic d={I.x} s={20} /></div>
        </div>
        <div className="sheet-body">
          {state === 'loading' && (
            <div className="cal-status">
              <span className="home-spinner"></span>
              Loading your calendar...
            </div>
          )}
          {state === 'error' && (
            <div className="cal-status cal-status-err">
              {err}
              <div style={{ marginTop: 8, fontSize: 12, opacity: 0.8 }}>
                Make sure Calendar API is enabled in Google Cloud Console.
              </div>
            </div>
          )}
          {state === 'empty' && (
            <div className="cal-status">No events found this year.</div>
          )}
          {state === 'list' && (
            <>
              <p style={{ fontSize: 13, color: 'var(--ink2)', marginBottom: 14 }}>
                Showing all events from <strong>{now.getFullYear()}</strong> — past and upcoming.
                Tap one to import as a new property.
              </p>
              <input
                type="text"
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder="Search events..."
                style={{ marginBottom: 14 }}
              />
              {filtered.length === 0 && (
                <div className="cal-status">No events match "{query}"</div>
              )}
              {upcoming.length > 0 && (
                <>
                  <div className="cal-section">Upcoming ({upcoming.length})</div>
                  {upcoming.map(renderEvent)}
                </>
              )}
              {past.length > 0 && (
                <>
                  <div className="cal-section">Past — {now.getFullYear()} ({past.length})</div>
                  {past.map(renderEvent)}
                </>
              )}
            </>
          )}
        </div>
        {state === 'list' && (
          <div className="sheet-foot">
            <button className="btn" onClick={onClose}>Cancel</button>
            <button
              className="btn btn-p"
              onClick={doImport}
              disabled={!sel || importing}
              style={{ opacity: sel && !importing ? 1 : 0.5 }}
            >
              {importing ? 'Importing...' : 'Import as new property'}
            </button>
          </div>
        )}
      </div>
    </>
  );
}

// =============================================================================
// HOME (Google Places Autocomplete)
// =============================================================================
function Home({ onPick, props, user, onLogout, onShowCalendar }) {
  const inputRef = useRef(null);
  const autocompleteRef = useRef(null);
  const [ready, setReady] = useState(false);
  const [err, setErr] = useState('');

  useEffect(() => {
    let cancelled = false;
    let pollId = null;

    const init = () => {
      if (cancelled) return;
      if (!inputRef.current) return;
      if (!window.google || !window.google.maps || !window.google.maps.places) return false;

      try {
        autocompleteRef.current = new window.google.maps.places.Autocomplete(inputRef.current, {
          types: ['address'],
          fields: ['formatted_address', 'geometry', 'name'],
        });
        autocompleteRef.current.addListener('place_changed', () => {
          const place = autocompleteRef.current.getPlace();
          if (!place.geometry || !place.geometry.location) {
            setErr('Please pick an address from the suggestions.');
            return;
          }
          setErr('');
          onPick({
            label: place.formatted_address || place.name || inputRef.current.value,
            lat: place.geometry.location.lat(),
            lng: place.geometry.location.lng(),
          });
        });
        setReady(true);
        return true;
      } catch (e) {
        console.error('Autocomplete init failed:', e);
        setErr('Could not load address search.');
        return true; // stop polling
      }
    };

    if (init() === false) {
      // Google Maps not loaded yet — poll
      pollId = setInterval(() => {
        if (init() !== false) clearInterval(pollId);
      }, 200);
    }

    return () => {
      cancelled = true;
      if (pollId) clearInterval(pollId);
      if (autocompleteRef.current && window.google) {
        window.google.maps.event.clearInstanceListeners(autocompleteRef.current);
        autocompleteRef.current = null;
      }
    };
  }, [onPick]);

  return (
    <div className="home">
      <div className="home-bg"></div>
      <div className="home-overlay"></div>

      {/* Top bar with user info / sign-in */}
      <div className="home-top-bar">
        {user ? (
          <>
            <button
              className="home-cal-btn"
              onClick={onShowCalendar}
              title="Import from Google Calendar"
            >
              <Ic d={I.cal} s={18} />
              <span className="home-cal-label">Calendar</span>
            </button>
            <div className="home-user" onClick={onLogout} title="Sign out">
              {user.picture ? (
                <img src={user.picture} alt="" />
              ) : (
                <div className="home-user-initial">{user.name.charAt(0)}</div>
              )}
            </div>
          </>
        ) : (
          <button className="home-cal-btn" onClick={onLogout}>
            <Ic d={I.user} s={18} />
            <span className="home-cal-label">Sign in</span>
          </button>
        )}
      </div>

      <div className="home-content">
        <div className="home-title-block">
          <div className="home-title">🌳 Arborist Field Tool</div>
          <div className="home-subtitle">Search any address to start an estimate</div>
        </div>

        <div className="home-search">
          <div className="home-search-icon"><Ic d={I.search} s={22} /></div>
          <input
            ref={inputRef}
            placeholder={ready ? 'Search property address…' : 'Loading address search…'}
            autoComplete="off"
            autoCorrect="off"
            spellCheck="false"
            disabled={!ready}
          />
          {err && (
            <div className="home-status home-status-warn">{err}</div>
          )}
        </div>

        <div className="home-hint">Tap an address from the suggestions to open the property map</div>
      </div>

      {props.length > 0 && (
        <div className="home-recent">
          <div className="home-recent-label">Recent properties</div>
          <div className="home-recent-list">
            {props.slice(-8).reverse().map(p => (
              <div key={p.id} className="home-recent-item" onClick={() => onPick({ existing: p.id })}>
                {p.address.split(',')[0]}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// =============================================================================
// CAMERA / DRAW
// =============================================================================
function PhotoEditor({ photo, onChange }) {
  const cvsRef = useRef(null);
  const [drawing, setDrawing] = useState(false);
  const [strokes, setStrokes] = useState(photo.strokes || []);
  const [current, setCurrent] = useState([]);
  const imgRef = useRef(null);

  const redraw = useCallback(() => {
    const cvs = cvsRef.current;
    if (!cvs || !imgRef.current) return;
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.drawImage(imgRef.current, 0, 0, cvs.width, cvs.height);
    ctx.strokeStyle = '#ff2d2d';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const all = current.length ? [...strokes, current] : strokes;
    all.forEach(stk => {
      if (stk.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(stk[0].x * cvs.width, stk[0].y * cvs.height);
      for (let i = 1; i < stk.length; i++) ctx.lineTo(stk[i].x * cvs.width, stk[i].y * cvs.height);
      ctx.stroke();
    });
  }, [strokes, current]);

  useEffect(() => {
    if (!photo.url) return;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      imgRef.current = img;
      const cvs = cvsRef.current;
      if (cvs) {
        cvs.width = img.naturalWidth;
        cvs.height = img.naturalHeight;
        redraw();
      }
    };
    img.src = photo.url;
  }, [photo.url]);

  useEffect(() => { redraw(); }, [redraw]);

  const getPos = (e) => {
    const cvs = cvsRef.current;
    const r = cvs.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height };
  };

  const start = (e) => { e.preventDefault(); setDrawing(true); setCurrent([getPos(e)]); };
  const move = (e) => { if (!drawing) return; e.preventDefault(); setCurrent(c => [...c, getPos(e)]); };
  const end = () => {
    if (!drawing) return;
    setDrawing(false);
    if (current.length > 1) {
      const newStrokes = [...strokes, current];
      setStrokes(newStrokes);
      saveStrokes(newStrokes);
    }
    setCurrent([]);
  };

  const saveStrokes = (newStrokes) => {
    const cvs = cvsRef.current;
    if (!cvs) return;
    onChange({ ...photo, strokes: newStrokes, drawnUrl: cvs.toDataURL('image/jpeg', 0.85) });
  };

  const undo = () => {
    const newStrokes = strokes.slice(0, -1);
    setStrokes(newStrokes);
    saveStrokes(newStrokes);
  };

  const clear = () => {
    setStrokes([]);
    saveStrokes([]);
  };

  return (
    <div className="cam-area">
      <canvas
        ref={cvsRef}
        className="cam-canvas"
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
      />
      <div className="cam-tools">
        <button className="cam-tool" onClick={undo}>
          <Ic d={I.undo} s={14} /> Undo
        </button>
        <button className="cam-tool" onClick={clear}>
          <Ic d={I.x} s={14} /> Clear
        </button>
        <div className="cam-tool" style={{ background: '#ff2d2d', color: '#fff' }}>
          ● Marker
        </div>
      </div>
    </div>
  );
}

// PIN BOTTOM SHEET
// =============================================================================
function PinSheet({ pin, onSave, onClose, onDelete }) {
  const [p, setP] = useState(pin);
  const [activePhoto, setActivePhoto] = useState(0);

  const upd = (changes) => setP(prev => ({ ...prev, ...changes }));

  useEffect(() => { onSave(p); }, [p]);

  const addPhoto = async (files) => {
    for (const f of Array.from(files)) {
      const url = await compress(f);
      if (url) {
        const newPhoto = { id: uid(), url, drawnUrl: url, strokes: [] };
        setP(prev => ({ ...prev, photos: [...prev.photos, newPhoto] }));
        setActivePhoto(p.photos.length);
      }
    }
  };

  const updatePhoto = (idx, updated) => {
    setP(prev => ({ ...prev, photos: prev.photos.map((ph, i) => i === idx ? updated : ph) }));
  };

  const removePhoto = (idx) => {
    setP(prev => ({ ...prev, photos: prev.photos.filter((_, i) => i !== idx) }));
    if (activePhoto >= idx) setActivePhoto(Math.max(0, activePhoto - 1));
  };

  const toggleTask = (id) => {
    const has = p.tasks.includes(id);
    upd({ tasks: has ? p.tasks.filter(t => t !== id) : [...p.tasks, id] });
  };

  const setTaskExtra = (id, v) => {
    upd({ taskExtras: { ...p.taskExtras, [id]: v } });
  };

  const toggleTreatment = () => {
    if (!p.treatmentEnabled) {
      upd({ treatmentEnabled: true, treatments: p.treatments.length ? p.treatments : [newTreatment()] });
    } else {
      upd({ treatmentEnabled: false });
    }
  };

  const updateTreat = (id, changes) => {
    upd({ treatments: p.treatments.map(t => t.id === id ? { ...t, ...changes } : t) });
  };

  const addTreat = () => upd({ treatments: [...p.treatments, newTreatment()] });

  const removeTreat = (id) => upd({ treatments: p.treatments.filter(t => t.id !== id) });

  return (
    <>
      <div className="sheet-bg" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-handle"><div className="sheet-grip"></div></div>
        <div className="sheet-head">
          <input
            value={p.label}
            onChange={e => upd({ label: e.target.value })}
            style={{ border: 'none', padding: 0, fontSize: 20, fontWeight: 700, letterSpacing: '-0.02em' }}
          />
          <div className="sheet-close" onClick={onClose}><Ic d={I.x} s={20} /></div>
        </div>

        <div className="sheet-body">
          {/* CAMERA */}
          <div className="sec">
            <div className="sec-label">Camera</div>
            {p.photos.length > 0 ? (
              <>
                <PhotoEditor
                  photo={p.photos[activePhoto]}
                  onChange={(updated) => updatePhoto(activePhoto, updated)}
                />
                <div className="photo-strip">
                  {p.photos.map((ph, i) => (
                    <div
                      key={ph.id}
                      className={'photo-thumb' + (i === activePhoto ? ' active' : '')}
                      onClick={() => setActivePhoto(i)}
                    >
                      <img src={ph.drawnUrl || ph.url} alt="" />
                      <div className="photo-thumb-x" onClick={(e) => { e.stopPropagation(); removePhoto(i); }}>×</div>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <div className="cam-area">
                <div className="cam-empty">
                  <Ic d={I.cam} s={40} />
                  <div style={{ fontSize: 13 }}>No photos yet</div>
                </div>
              </div>
            )}
            <div className="cam-add-row">
              <label className="cam-add-btn">
                <Ic d={I.cam} s={18} />
                Take Photo
                <input type="file" accept="image/*" capture="environment"
                  onChange={e => addPhoto(e.target.files)} />
              </label>
              <label className="cam-add-btn">
                <Ic d={I.plus} s={18} />
                Upload
                <input type="file" accept="image/*" multiple
                  onChange={e => addPhoto(e.target.files)} />
              </label>
            </div>
          </div>

          {/* STRUCTURAL TASKS */}
          <div className="sec">
            <div className="sec-label">Structural Tasks</div>
            <div className="task-grid">
              {TASKS.map(t => {
                const on = p.tasks.includes(t.id);
                return (
                  <div key={t.id} style={{ display: 'flex', flexDirection: 'column' }}>
                    <button
                      className={'task-btn' + (on ? ' on' : '')}
                      onClick={() => toggleTask(t.id)}
                    >
                      <span className="task-num">{t.n}.</span>
                      <span style={{ flex: 1 }}>{t.l}</span>
                    </button>
                    {on && t.extra && (
                      <input
                        className="task-extra"
                        type="number"
                        inputMode="numeric"
                        value={p.taskExtras[t.id] || ''}
                        onChange={e => setTaskExtra(t.id, e.target.value)}
                        placeholder={'# ' + t.extra}
                        onClick={e => e.stopPropagation()}
                      />
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* TREATMENT */}
          <div className="sec">
            <div className="sec-label">Tree Treatment</div>
            <div className="toggle-row" onClick={toggleTreatment}>
              <div className="lbl">Add Treatment</div>
              <div className={'toggle' + (p.treatmentEnabled ? ' on' : '')}></div>
            </div>
            {p.treatmentEnabled && (
              <>
                {p.treatments.map((t, i) => (
                  <div key={t.id} className="treat-card">
                    <div className="treat-card-head">
                      <div className="treat-card-title">Treatment {i + 1}</div>
                      {p.treatments.length > 1 && (
                        <button className="treat-card-rm" onClick={() => removeTreat(t.id)}>Remove</button>
                      )}
                    </div>
                    <input
                      type="text"
                      value={t.type}
                      onChange={e => updateTreat(t.id, { type: e.target.value })}
                      placeholder="Treatment type (e.g. Oak Wilt Injection)"
                      style={{ marginBottom: 8 }}
                    />
                    <div className="treat-row">
                      <input
                        type="number"
                        inputMode="decimal"
                        value={t.dbh}
                        onChange={e => updateTreat(t.id, { dbh: e.target.value })}
                        placeholder="DBH (in)"
                      />
                      <div className="price-input">
                        <input
                          type="number"
                          inputMode="decimal"
                          value={t.price}
                          onChange={e => updateTreat(t.id, { price: e.target.value })}
                          placeholder="Price"
                        />
                      </div>
                    </div>
                    <textarea
                      value={t.notes}
                      onChange={e => updateTreat(t.id, { notes: e.target.value })}
                      placeholder="Notes (optional)"
                      rows={2}
                      style={{ fontSize: 14, padding: '10px 12px', marginTop: 8, background: '#fff' }}
                    />
                  </div>
                ))}
                <button className="treat-add" onClick={addTreat}>
                  <Ic d={I.plus} s={16} />
                  Add Another Treatment
                </button>
              </>
            )}
          </div>

          {/* STRUCTURAL PRICE */}
          <div className="sec">
            <div className="sec-label">Structural Price</div>
            <div className="price-input">
              <input
                type="number"
                inputMode="decimal"
                value={p.structuralPrice}
                onChange={e => upd({ structuralPrice: e.target.value })}
                placeholder="0"
              />
            </div>
          </div>

          {/* NOTES */}
          <div className="sec">
            <div className="sec-label">Notes</div>
            <textarea
              value={p.notes}
              onChange={e => upd({ notes: e.target.value })}
              placeholder="Additional notes (optional)"
              rows={3}
            />
          </div>
        </div>

        <div className="sheet-foot">
          <button className="btn btn-d btn-icon" onClick={onDelete}>
            <Ic d={I.trash} s={18} />
          </button>
          <button className="btn btn-p" onClick={onClose}>Done</button>
        </div>
      </div>
    </>
  );
}

// =============================================================================
// PROPERTY (MAP) SCREEN
// =============================================================================
function Property({ prop, onUpdate, onBack, onSummary }) {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef({});
  const [openPin, setOpenPin] = useState(null);
  const [adding, setAdding] = useState(false);
  const addingRef = useRef(false);

  useEffect(() => { addingRef.current = adding; }, [adding]);

  useEffect(() => {
    let cancelled = false;
    let pollInterval = null;

    const initMap = () => {
      if (cancelled || !mapDivRef.current || mapRef.current || !window.L) return;
      const center = [prop.lat || 30.267, prop.lng || -97.743];
      const map = window.L.map(mapDivRef.current, {
        center, zoom: 19, zoomControl: true, attributionControl: false,
      });
      window.L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 21 }
      ).addTo(map);
      window.L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 21, opacity: 0.6 }
      ).addTo(map);
      map.on('click', (e) => {
        if (addingRef.current) {
          addPinAt(e.latlng.lat, e.latlng.lng);
          setAdding(false);
        }
      });
      mapRef.current = map;
      setTimeout(() => {
        if (mapRef.current) mapRef.current.invalidateSize();
      }, 200);
    };

    if (window.L) {
      initMap();
    } else {
      pollInterval = setInterval(() => {
        if (window.L) {
          clearInterval(pollInterval);
          pollInterval = null;
          initMap();
        }
      }, 100);
    }

    return () => {
      cancelled = true;
      if (pollInterval) clearInterval(pollInterval);
      if (mapRef.current) {
        mapRef.current.remove();
        mapRef.current = null;
      }
    };
  }, []);

  // Sync markers
  useEffect(() => {
    if (!mapRef.current || !window.L) return;
    const map = mapRef.current;
    const ids = new Set(prop.pins.map(p => p.id));
    Object.keys(markersRef.current).forEach(id => {
      if (!ids.has(id)) {
        map.removeLayer(markersRef.current[id]);
        delete markersRef.current[id];
      }
    });
    prop.pins.forEach((pin, i) => {
      if (pin.lat == null || pin.lng == null) return;
      const html = '<div class="tree-marker">' + (i + 1) + '</div>';
      const icon = window.L.divIcon({ className: '', html, iconSize: [36, 36], iconAnchor: [18, 18] });
      if (markersRef.current[pin.id]) {
        markersRef.current[pin.id].setIcon(icon);
        markersRef.current[pin.id].setLatLng([pin.lat, pin.lng]);
      } else {
        const m = window.L.marker([pin.lat, pin.lng], { icon, draggable: true }).addTo(map);
        m.on('click', () => setOpenPin(pin.id));
        m.on('dragend', (e) => {
          const ll = e.target.getLatLng();
          onUpdate({
            ...prop,
            pins: prop.pins.map(p => p.id === pin.id ? { ...p, lat: ll.lat, lng: ll.lng } : p),
          });
        });
        markersRef.current[pin.id] = m;
      }
    });
  }, [prop.pins]);

  const addPinAt = (lat, lng) => {
    const pin = newPin(prop.pins.length + 1, lat, lng);
    onUpdate({ ...prop, pins: [...prop.pins, pin] });
    setTimeout(() => setOpenPin(pin.id), 150);
  };

  const updatePin = (updated) => {
    onUpdate({
      ...prop,
      pins: prop.pins.map(p => p.id === updated.id ? updated : p),
    });
  };

  const deletePin = (id) => {
    onUpdate({
      ...prop,
      pins: prop.pins.filter(p => p.id !== id).map((p, i) => ({ ...p, label: 'Tree ' + (i + 1) })),
    });
    setOpenPin(null);
  };

  const currentPin = prop.pins.find(p => p.id === openPin);

  return (
    <div className="prop">
      <div ref={mapDivRef} className="map"></div>

      {/* Top bar with back button and address */}
      <div className="prop-topbar">
        <button className="prop-back" onClick={onBack} aria-label="Back">
          <Ic d={I.back} s={22} />
        </button>
        <div className="prop-addr">
          <div className="prop-addr-title">{prop.address.split(',')[0]}</div>
          <div className="prop-addr-sub">
            {prop.pins.length} pin{prop.pins.length !== 1 ? 's' : ''}
            {prop.address.split(',').length > 1 && ' · ' + prop.address.split(',').slice(1, 3).join(',').trim()}
          </div>
        </div>
        {prop.pins.length > 0 && (
          <button className="prop-estimate-btn" onClick={onSummary}>
            <Ic d={I.doc} s={16} />
            Estimate
          </button>
        )}
      </div>

      {/* Floating Add Pin button */}
      <div className="prop-fab-wrap">
        <button
          className={'prop-fab' + (adding ? ' prop-fab-cancel' : '')}
          onClick={() => setAdding(!adding)}
        >
          {adding ? (<><Ic d={I.x} s={20} /> Cancel</>) : (<><Ic d={I.plus} s={20} /> Add Pin</>)}
        </button>
      </div>

      {adding && (
        <div className="map-banner">
          Tap anywhere on the map to drop a pin
        </div>
      )}

      {currentPin && (
        <PinSheet
          pin={currentPin}
          onSave={updatePin}
          onClose={() => setOpenPin(null)}
          onDelete={() => deletePin(currentPin.id)}
        />
      )}
    </div>
  );
}

// =============================================================================
// SUMMARY
// =============================================================================
function Summary({ prop, onBack }) {
  const sumMapDivRef = useRef(null);
  const sumMapRef = useRef(null);

  useEffect(() => {
    if (!sumMapDivRef.current || sumMapRef.current || !window.L) return;
    const map = window.L.map(sumMapDivRef.current, {
      center: [prop.lat, prop.lng], zoom: 19,
      zoomControl: false, attributionControl: false,
      dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false,
    });
    window.L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 21 }
    ).addTo(map);
    prop.pins.forEach((pin, i) => {
      if (pin.lat == null || pin.lng == null) return;
      const html = '<div class="tree-marker">' + (i + 1) + '</div>';
      window.L.marker([pin.lat, pin.lng], {
        icon: window.L.divIcon({ className: '', html, iconSize: [36, 36], iconAnchor: [18, 18] }),
      }).addTo(map);
    });
    sumMapRef.current = map;
    setTimeout(() => {
      map.invalidateSize();
      if (prop.pins.length > 1) {
        const bounds = window.L.latLngBounds(prop.pins.map(p => [p.lat, p.lng]));
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }, 200);
    return () => {
      if (sumMapRef.current) { sumMapRef.current.remove(); sumMapRef.current = null; }
    };
  }, []);

  const structuralLines = prop.pins.map((pin, i) => {
    const tasks = pin.tasks.map(tid => {
      const t = TASKS.find(x => x.id === tid);
      if (!t) return null;
      const ex = pin.taskExtras[tid];
      return t.l + (ex ? ' (' + ex + ' ' + (t.extra || '') + ')' : '');
    }).filter(Boolean);
    return { pin, tasks, label: pin.label || ('Tree ' + (i + 1)) };
  }).filter(x => x.tasks.length > 0 || (parseFloat(x.pin.structuralPrice) || 0) > 0);

  const treatmentLines = prop.pins.flatMap((pin, i) => {
    if (!pin.treatmentEnabled) return [];
    return pin.treatments.filter(t => t.type || parseFloat(t.price)).map(t => ({
      pin, treatment: t, label: pin.label || ('Tree ' + (i + 1)),
    }));
  });

  const structSubtotal = prop.pins.reduce((s, p) => s + (parseFloat(p.structuralPrice) || 0), 0);
  const treatSubtotal = prop.pins.reduce((s, p) => {
    if (!p.treatmentEnabled) return s;
    return s + p.treatments.reduce((ss, t) => ss + (parseFloat(t.price) || 0), 0);
  }, 0);
  const grandTotal = structSubtotal + treatSubtotal;

  const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  const exportEstimate = () => {
    const esc = (s) => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const treeBlocksStruct = structuralLines.map(({ pin, tasks, label }) => {
      const price = parseFloat(pin.structuralPrice) || 0;
      const tasksHtml = tasks.length
        ? '<ul style="margin:6px 0 0 18px;padding:0;font-size:13px;line-height:1.7">' + tasks.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>'
        : '';
      return '<div style="padding:10px 0;border-bottom:1px solid #eee">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">' +
        '<div style="flex:1"><strong style="color:#1a3018">' + esc(label) + '</strong>' + tasksHtml + '</div>' +
        (price > 0 ? '<div style="font-family:monospace;font-weight:600;color:#1a3018">$' + price.toLocaleString() + '</div>' : '') +
        '</div></div>';
    }).join('');

    const treeBlocksTreat = treatmentLines.map(({ pin, treatment, label }) => {
      const price = parseFloat(treatment.price) || 0;
      const dbh = treatment.dbh ? ' — ' + treatment.dbh + '" DBH' : '';
      return '<div style="padding:10px 0;border-bottom:1px solid #eee">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">' +
        '<div style="flex:1"><strong style="color:#1a3018">' + esc(label) + '</strong> — ' + esc(treatment.type || 'Treatment') + esc(dbh) +
        (treatment.notes ? '<div style="font-size:12px;color:#666;font-style:italic;margin-top:3px">' + esc(treatment.notes) + '</div>' : '') +
        '</div>' +
        (price > 0 ? '<div style="font-family:monospace;font-weight:600;color:#1a3018">$' + price.toLocaleString() + '</div>' : '') +
        '</div></div>';
    }).join('');

    const writeupStruct = structuralLines.map(({ tasks, label }) =>
      tasks.length ? '<p>' + esc(label) + ': ' + esc(tasks.join(', ')) + '</p>' : ''
    ).join('');

    const writeupTreat = treatmentLines.map(({ treatment, label }) => {
      const dbh = treatment.dbh ? ' (' + treatment.dbh + '" DBH)' : '';
      return '<p>' + esc(label) + ': ' + esc(treatment.type || 'treatment') + esc(dbh) + '</p>';
    }).join('');

    const photos = prop.pins.flatMap((pin, i) => (pin.photos || []).map(ph => ({
      label: pin.label || ('Tree ' + (i + 1)),
      url: ph.drawnUrl || ph.url,
    })));

    const photosHtml = photos.length
      ? photos.map(p => '<div style="break-inside:avoid;margin-bottom:12px"><div style="font-size:12px;font-weight:600;color:#666;margin-bottom:4px">' + esc(p.label) + '</div><img src="' + esc(p.url) + '" style="width:100%;border-radius:8px;border:1px solid #ddd"/></div>').join('')
      : '<p style="color:#999;font-style:italic">No photos</p>';

    const html = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<title>Estimate — ' + esc(prop.address.split(',')[0]) + '</title>' +
      '<style>' +
      '@page{margin:0.5in}' +
      '*{box-sizing:border-box}' +
      'body{font-family:-apple-system,"SF Pro Display",Arial,sans-serif;max-width:7.5in;margin:0 auto;padding:24px;color:#222;line-height:1.5}' +
      '.h1{font-size:24px;font-weight:700;color:#1a3018;letter-spacing:-0.02em;margin-bottom:4px}' +
      '.meta{font-size:13px;color:#666;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid #1a3018}' +
      '.h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#666;margin:24px 0 8px}' +
      '.section{padding:16px;background:#f7f7f5;border-radius:12px;margin-bottom:14px}' +
      '.totals{padding:18px 22px;background:#1a3018;color:#fff;border-radius:12px;margin-top:24px}' +
      '.total-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}' +
      '.total-line.grand{border-top:1px solid rgba(255,255,255,0.3);margin-top:8px;padding-top:12px;font-size:18px;font-weight:700}' +
      '.images{column-count:2;column-gap:10px;margin-top:8px}' +
      '.actions{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:10}' +
      '.actions button{background:#1a3018;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}' +
      '.actions .close{background:#666}' +
      '@media print{.actions{display:none}body{padding:0}}' +
      '</style></head><body>' +
      '<div class="actions"><button onclick="window.print()">Print / Save PDF</button><button class="close" onclick="window.close()">Close</button></div>' +
      '<div class="h1">Tree Service Estimate</div>' +
      '<div class="meta"><strong>' + esc(prop.address) + '</strong><br/>' + date + '</div>' +
      (writeupStruct ? '<div class="h2">Scope of Work — Structural</div><div class="section">' + writeupStruct + '</div>' : '') +
      (writeupTreat ? '<div class="h2">Scope of Work — Treatments</div><div class="section">' + writeupTreat + '</div>' : '') +
      '<div class="h2">Photos</div><div class="images">' + photosHtml + '</div>' +
      (treeBlocksStruct ? '<div class="h2">Line Items — Structural</div><div class="section" style="background:#fff;border:1px solid #e5e5e0">' + treeBlocksStruct + '</div>' : '') +
      (treeBlocksTreat ? '<div class="h2">Line Items — Treatments</div><div class="section" style="background:#fff;border:1px solid #e5e5e0">' + treeBlocksTreat + '</div>' : '') +
      '<div class="totals">' +
      '<div class="total-line"><span>Structural Subtotal</span><span>$' + structSubtotal.toLocaleString() + '</span></div>' +
      '<div class="total-line"><span>Treatment Subtotal</span><span>$' + treatSubtotal.toLocaleString() + '</span></div>' +
      '<div class="total-line grand"><span>Grand Total</span><span>$' + grandTotal.toLocaleString() + '</span></div>' +
      '</div>' +
      '</body></html>';

    const w = window.open('', '_blank');
    if (!w) { alert('Please allow popups to export'); return; }
    w.document.write(html);
    w.document.close();
  };

  const sharedShare = async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Tree Estimate',
          text: prop.address + ' — Total: $' + grandTotal.toLocaleString(),
        });
      } catch {}
    } else {
      exportEstimate();
    }
  };

  return (
    <div className="sum">
      <div className="sum-top">
        <div className="back" onClick={onBack}><Ic d={I.back} s={20} /></div>
        <h1>Estimate</h1>
        <button className="ex" onClick={exportEstimate}>
          <Ic d={I.print} s={14} /> Export
        </button>
      </div>

      <div className="sum-body">
        {/* MAP */}
        <div className="sum-section">
          <div className="sum-h">Property Map</div>
          <div ref={sumMapDivRef} className="sum-map"></div>
          <div style={{ fontSize: 13, color: 'var(--ink2)', marginTop: 8 }}>
            <strong>{prop.address.split(',')[0]}</strong>
            <div style={{ fontSize: 12, color: 'var(--ink3)', marginTop: 2 }}>{prop.address}</div>
          </div>
        </div>

        {/* WRITE-UP */}
        <div className="sum-section">
          <div className="sum-h">Scope of Work</div>

          {structuralLines.some(l => l.tasks.length > 0) && (
            <>
              <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--g)', marginBottom: 8 }}>STRUCTURAL</div>
              {structuralLines.filter(l => l.tasks.length > 0).map(({ tasks, label }, i) => (
                <div key={i} className="sum-tree">
                  <div className="sum-tree-name">{label}</div>
                  <div className="sum-tree-text">{tasks.join(', ')}</div>
                </div>
              ))}
            </>
          )}

          {treatmentLines.length > 0 && (
            <>
              <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--g)', marginTop: 16, marginBottom: 8 }}>TREATMENT</div>
              {treatmentLines.map(({ treatment, label }, i) => (
                <div key={i} className="sum-tree">
                  <div className="sum-tree-name">{label}</div>
                  <div className="sum-tree-text">
                    {treatment.type || 'Treatment'}
                    {treatment.dbh && ' (' + treatment.dbh + '" DBH)'}
                    {treatment.notes && <div style={{ fontStyle: 'italic', color: 'var(--ink3)', marginTop: 2 }}>{treatment.notes}</div>}
                  </div>
                </div>
              ))}
            </>
          )}

          {structuralLines.length === 0 && treatmentLines.length === 0 && (
            <div style={{ color: 'var(--ink3)', fontSize: 14, textAlign: 'center', padding: 20 }}>
              No work items added yet
            </div>
          )}
        </div>

        {/* PHOTOS */}
        {prop.pins.some(p => (p.photos || []).length > 0) && (
          <div className="sum-section">
            <div className="sum-h">Photos by Tree</div>
            {prop.pins.filter(p => (p.photos || []).length > 0).map((pin, i) => (
              <div key={pin.id} style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--g)', marginBottom: 6 }}>
                  {pin.label || ('Tree ' + (i + 1))}
                </div>
                <div className="sum-images">
                  {pin.photos.map(ph => (
                    <img key={ph.id} src={ph.drawnUrl || ph.url} alt="" />
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* LINE ITEMS — STRUCTURAL */}
        {structuralLines.length > 0 && (
          <div className="sum-section">
            <div className="sum-h">Line Items — Structural</div>
            {structuralLines.map(({ pin, tasks, label }, i) => {
              const price = parseFloat(pin.structuralPrice) || 0;
              return (
                <div key={i} className="line">
                  <div className="line-l">
                    <div className="line-l-t">{label}</div>
                    {tasks.length > 0 && <div className="line-l-s">{tasks.join(', ')}</div>}
                  </div>
                  {price > 0 && <div className="line-r">${price.toLocaleString()}</div>}
                </div>
              );
            })}
          </div>
        )}

        {/* LINE ITEMS — TREATMENTS */}
        {treatmentLines.length > 0 && (
          <div className="sum-section">
            <div className="sum-h">Line Items — Treatments</div>
            {treatmentLines.map(({ pin, treatment, label }, i) => {
              const price = parseFloat(treatment.price) || 0;
              return (
                <div key={i} className="line">
                  <div className="line-l">
                    <div className="line-l-t">{label}</div>
                    <div className="line-l-s">
                      {treatment.type || 'Treatment'}
                      {treatment.dbh && ' — ' + treatment.dbh + '" DBH'}
                    </div>
                  </div>
                  {price > 0 && <div className="line-r">${price.toLocaleString()}</div>}
                </div>
              );
            })}
          </div>
        )}

        {/* TOTALS */}
        <div className="sum-section">
          <div className="sum-h">Totals</div>
          <div className="total-row">
            <span>Structural subtotal</span>
            <span className="amt">${structSubtotal.toLocaleString()}</span>
          </div>
          <div className="total-row">
            <span>Treatment subtotal</span>
            <span className="amt">${treatSubtotal.toLocaleString()}</span>
          </div>
          <div className="total-row grand">
            <span>Grand total</span>
            <span className="amt">${grandTotal.toLocaleString()}</span>
          </div>
        </div>

        <div style={{ padding: '12px 16px 32px', display: 'flex', gap: 10 }}>
          <button className="btn" onClick={sharedShare}>
            <Ic d={I.share} s={18} /> Share
          </button>
          <button className="btn btn-p" onClick={exportEstimate}>
            <Ic d={I.print} s={18} /> Export PDF
          </button>
        </div>
      </div>
    </div>
  );
}

// =============================================================================
// APP
// =============================================================================
function App() {
  const [user, setUser] = useState(loadSession);
  const [showLogin, setShowLogin] = useState(false);
  const [props, setProps] = useState(loadProps);
  const [view, setView] = useState({ name: 'home' });
  const [showCalendar, setShowCalendar] = useState(false);

  const persist = (newProps) => {
    setProps(newProps);
    saveProps(newProps);
  };

  const handleLogin = (u) => {
    setUser(u);
    setShowLogin(false);
  };

  const handleLogout = () => {
    if (user) {
      // Already signed in — sign out
      if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.disableAutoSelect();
      }
      setUser(null);
      clearSession();
    } else {
      // Not signed in — open login
      setShowLogin(true);
    }
  };

  const pickAddress = (s) => {
    if (s.existing) {
      setView({ name: 'prop', id: s.existing });
      return;
    }
    const newProp = {
      id: uid(),
      address: s.label,
      lat: s.lat,
      lng: s.lng,
      pins: [],
      created: Date.now(),
    };
    persist([...props, newProp]);
    setView({ name: 'prop', id: newProp.id });
  };

  const handleCalendarImport = (importedProp) => {
    persist([...props, importedProp]);
    setView({ name: 'prop', id: importedProp.id });
  };

  const handleShowCalendar = () => {
    if (!user) {
      setShowLogin(true);
      return;
    }
    setShowCalendar(true);
  };

  const updateProp = (updated) => {
    persist(props.map(p => p.id === updated.id ? updated : p));
  };

  if (showLogin) {
    return <LoginScreen onLogin={handleLogin} onSkip={() => setShowLogin(false)} />;
  }

  if (view.name === 'home') {
    return (
      <>
        <Home
          onPick={pickAddress}
          props={props}
          user={user}
          onLogout={handleLogout}
          onShowCalendar={handleShowCalendar}
        />
        {showCalendar && (
          <CalendarModal
            onImport={handleCalendarImport}
            onClose={() => setShowCalendar(false)}
          />
        )}
      </>
    );
  }

  const current = props.find(p => p.id === view.id);
  if (!current) {
    setView({ name: 'home' });
    return null;
  }

  if (view.name === 'prop') {
    return (
      <Property
        prop={current}
        onUpdate={updateProp}
        onBack={() => setView({ name: 'home' })}
        onSummary={() => setView({ name: 'sum', id: current.id })}
      />
    );
  }

  if (view.name === 'sum') {
    return (
      <Summary
        prop={current}
        onBack={() => setView({ name: 'prop', id: current.id })}
      />
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
